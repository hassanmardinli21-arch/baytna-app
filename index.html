<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6B9080">
<title>بيتنا</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F1EA; --card: #FFFFFF;
    --primary: #6B9080; --primary-dark: #4A6D5F;
    --accent: #C9A58D; --text: #2D3A3A; --text-light: #7A8787;
    --border: #EAE3D9; --danger: #B87B6E;
    --success: #7BA77E; --success-dark: #4A7C4E;
    --warning: #D4A55C;
    --shadow: 0 2px 12px rgba(45, 58, 58, 0.06);
    --shadow-lg: 0 12px 40px rgba(45, 58, 58, 0.18);
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }
  body { padding-bottom: 100px; }

  .login-wrap {
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px;
    background: linear-gradient(160deg, #F5F1EA 0%, #E8DFD2 100%);
  }
  .login-logo {
    width: 90px; height: 90px; border-radius: 28px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; margin-bottom: 24px;
    box-shadow: 0 12px 32px rgba(107, 144, 128, 0.3);
  }
  .login-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .login-sub { color: var(--text-light); font-size: 15px; margin-bottom: 40px; }
  .login-form { width: 100%; max-width: 360px; }
  .input-group { margin-bottom: 16px; }
  .input-label { font-size: 14px; color: var(--text-light); margin-bottom: 8px; display: block; font-weight: 500; }
  .input-field {
    width: 100%; padding: 16px 18px;
    border: 2px solid var(--border); border-radius: 16px;
    background: var(--card); font-size: 16px; font-family: inherit; color: var(--text);
  }

  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; font-size: 16px; font-weight: 600; font-family: inherit;
    cursor: pointer; box-shadow: 0 4px 16px rgba(107, 144, 128, 0.25);
  }

  .app-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245, 241, 234, 0.92);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-title span { color: var(--primary); }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer; box-shadow: var(--shadow);
  }
  .container { max-width: 560px; margin: 0 auto; padding: 16px 20px; }

  .summary-card {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; padding: 22px; border-radius: 22px;
    margin-bottom: 16px; box-shadow: 0 8px 24px rgba(107, 144, 128, 0.25);
  }
  .summary-row { display: flex; justify-content: space-between; align-items: center; }
  .summary-label { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
  .summary-value { font-size: 32px; font-weight: 700; }
  .summary-stats { display: flex; gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.2); }
  .summary-stat { flex: 1; }
  .summary-stat-label { font-size: 12px; opacity: 0.8; margin-bottom: 2px; }
  .summary-stat-value { font-size: 18px; font-weight: 700; }

  .action-main-btn {
    width: 100%; padding: 16px; margin-bottom: 12px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; font-family: inherit; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 18px rgba(107, 144, 128, 0.25);
  }

  .archive-day-btn {
    width: 100%; padding: 16px; margin-bottom: 12px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, #2D3A3A 0%, #1A2222 100%);
    color: white; font-family: inherit; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 18px rgba(45, 58, 58, 0.3);
  }

  .monthly-big-btn {
    width: 100%; padding: 16px; margin-bottom: 16px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%);
    color: white; font-family: inherit; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 18px rgba(184, 123, 58, 0.3);
  }

  .today-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; margin-bottom: 12px;
    background: linear-gradient(135deg, #FFFFFF 0%, #F0EBE0 100%);
    border: 1px solid var(--border); border-radius: 14px;
    font-size: 14px; font-weight: 700; color: var(--primary-dark);
  }

  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-input {
    width: 100%; padding: 14px 44px 14px 18px;
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--card); font-size: 15px; font-family: inherit; color: var(--text);
  }

  .item-card {
    background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    transition: all 0.3s ease;
  }
  .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
  .item-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .item-meta { font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-badge { padding: 3px 8px; border-radius: 6px; background: #F0EBE0; font-size: 11px; color: var(--text-light); }
  .item-price-info { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; justify-content: space-between; }
  .item-price-badge { padding: 5px 10px; border-radius: 10px; background: #E8F5E9; color: #1B5E20; font-size: 13px; font-weight: 600; border: 1.5px solid #7BA77E; }
  .item-total-badge { padding: 5px 12px; border-radius: 10px; background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%); color: white; font-size: 14px; font-weight: 700; }

  .item-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .action-btn {
    padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .action-btn.edit { color: var(--primary-dark); border-color: var(--primary); }
  .action-btn.done { color: var(--success-dark); border-color: var(--success); }
  .action-btn.cancel { color: var(--warning); border-color: var(--warning); }
  .action-btn.delete { color: var(--danger); border-color: var(--danger); }

  .calc-fab {
    position: fixed; bottom: 24px; right: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #4A6D5F 0%, #2D3A3A 100%);
    color: white; border: none; font-size: 26px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(45, 58, 58, 0.35); z-index: 90;
  }

  .calculator-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
  .calc-screen {
    grid-column: span 4; background: #2D3A3A; color: #FFFFFF;
    font-size: 28px; font-weight: 700; text-align: left; padding: 18px; border-radius: 16px;
    min-height: 65px; display: flex; align-items: center; justify-content: flex-end; direction: ltr;
  }
  .calc-btn {
    padding: 14px; font-size: 18px; font-weight: 700; border-radius: 14px;
    border: 1.5px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
  }
  .calc-btn.op { background: #E8EEF2; color: var(--primary-dark); }
  .calc-btn.equal { background: var(--primary); color: white; border: none; grid-row: span 2; }
  .calc-btn.clear { background: #FFF5F3; color: var(--danger); border-color: #F0D5CF; }
  .calc-btn.mem { background: #F0EBE0; color: var(--text); font-size: 14px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(45, 58, 58, 0.5);
    backdrop-filter: blur(4px); z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .sheet {
    width: 100%; max-width: 480px; background: var(--bg);
    border-radius: 24px; padding: 24px; overflow-y: auto; max-height: 90vh;
    box-shadow: var(--shadow-lg);
  }
  .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  .sheet-close { width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .month-picker-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .select-field { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); font-size: 14px; font-weight: 600; }
  .pdf-btn {
    width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #B87B6E 0%, #8A4238 100%); color: white; font-size: 15px; font-weight: 700; cursor: pointer;
  }

  .form-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .form-group { flex: 1; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; }
  .form-control { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 15px; font-family: inherit; outline: none; }
  .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(107, 144, 128, 0.1); }
  .btn-submit { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
  .btn-danger { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--danger); background: #FFF5F3; color: var(--danger); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; }

  .day-group { margin-bottom: 14px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .day-group-header { background: #F0EBE0; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: var(--primary-dark); gap: 8px; flex-wrap: wrap; }
  .day-group-header .day-total { color: var(--primary-dark); }
  .day-actions { display: flex; gap: 5px; flex-wrap: wrap; }
  .mini-btn { padding: 4px 9px; border-radius: 7px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .mini-btn.del { color: var(--danger); border-color: #E5C2BB; }
  .mini-btn.move { color: var(--primary-dark); border-color: var(--primary); }
  .mini-btn.edit { color: var(--warning); border-color: #E8CFA0; }
  .day-group-body { padding: 6px 12px; }
  .day-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 6px; }
  .day-row:last-child { border-bottom: none; }
  .day-row .row-label { flex: 1; }
  .row-actions { display: flex; gap: 4px; }
  .row-actions button { padding: 3px 7px; font-size: 11px; }
  .month-grand-total { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 10px; border-top: 2px solid var(--primary); font-weight: 700; font-size: 15px; }

  /* نافذة تعديل مادة */
  #editItemModal .sheet { max-width: 420px; }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen" class="login-wrap">
  <div class="login-logo">🏠</div>
  <div class="login-title">بيتنا</div>
  <div class="login-sub">إدارة مخزون المنزل بذكاء</div>
  <div class="login-form">
    <div class="input-group">
      <label class="input-label">اسمك</label>
      <input type="text" id="usernameInput" class="input-field" value="حسان" autocomplete="off">
    </div>
    <button class="btn" type="button" onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- الشاشة الرئيسية -->
<div id="homeScreen" style="display: none;">
  <div class="app-header">
    <div class="header-title">بيت <span id="usernameDisplay">حسان</span> <span>🏠</span></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
      <button class="icon-btn" onclick="showMonthlyReport()" title="الأرشيف والسجل الشهري">📅</button>
      <button class="icon-btn" onclick="logout()" title="خروج">🚪</button>
    </div>
  </div>

  <div class="container">
    <div class="summary-card">
      <div class="summary-row">
        <div>
          <div class="summary-label">💰 إجمالي مشتريات اليوم</div>
          <div class="summary-value"><span id="totalPrice">0.00</span> <small>$</small></div>
        </div>
        <div style="font-size: 40px; opacity: 0.4;">🛒</div>
      </div>
      <div class="summary-stats">
        <div class="summary-stat">
          <div class="summary-stat-label">📦 إجمالي المواد</div>
          <div class="summary-stat-value"><span id="totalWeight">0</span> <small style="font-size:12px;">مادة</small></div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">✅ مكتملة</div>
          <div class="summary-stat-value"><span id="doneCount">0</span></div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">⏳ معلّقة</div>
          <div class="summary-stat-value"><span id="activeCount">0</span></div>
        </div>
      </div>
    </div>

    <button class="action-main-btn" onclick="openAddItemModal()">➕ إضافة مادة جديدة لليوم</button>
    <button class="archive-day-btn" onclick="archiveCurrentDay()">📥 أرشفة ونهاية اليوم (ترحيل للسجل وبدء يوم جديد)</button>
    <button class="monthly-big-btn" onclick="showMonthlyReport()">📅 تصفح السجل الشهري والأرشيف وحفظ PDF</button>

    <div class="today-bar" id="currentDateBar">
      <span>📅 نشاط اليوم</span>
      <span id="dateDisplayString" style="color: var(--text-light); font-size: 12.5px;"></span>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث في مواد اليوم..." oninput="filterTodayItems()">
    </div>

    <div id="itemsList"></div>
  </div>

  <button class="calc-fab" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
</div>

<!-- نافذة إضافة مادة جديدة -->
<div id="addItemModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title">
      <span>➕ إضافة مادة جديدة</span>
      <button class="sheet-close" onclick="closeAddItemModal()">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">اسم المادة</label>
      <input type="text" id="itemNameInput" class="form-control" placeholder="مثال: تفاح أحمر">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">السعر ($)</label>
        <input type="number" id="itemPriceInput" class="form-control" placeholder="0.00" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">الكمية</label>
        <input type="number" id="itemWeightInput" class="form-control" placeholder="1">
      </div>
    </div>
    <div class="form-group" style="margin-bottom: 10px;">
      <label class="form-label">وحدة القياس</label>
      <select id="itemUnitInput" class="form-control">
        <option value="كغ">كغ</option>
        <option value="ليتر">ليتر</option>
        <option value="علبه">علبه</option>
        <option value="ربطة">ربطة</option>
        <option value="قطعة">قطعة</option>
      </select>
    </div>
    <button class="btn-submit" onclick="submitNewItem()">حفظ المادة</button>
  </div>
</div>

<!-- نافذة تعديل مادة في السجل -->
<div id="editItemModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title">
      <span>✏️ تعديل مادة في السجل</span>
      <button class="sheet-close" onclick="closeEditItemModal()">✕</button>
    </div>
    <input type="hidden" id="editItemArchId">
    <div class="form-group" style="margin-bottom:12px;">
      <label class="form-label">اسم المادة</label>
      <input type="text" id="editItemName" class="form-control">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">السعر ($)</label>
        <input type="number" id="editItemPrice" class="form-control" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">الكمية</label>
        <input type="number" id="editItemWeight" class="form-control">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:10px;">
      <label class="form-label">وحدة القياس</label>
      <select id="editItemUnit" class="form-control">
        <option value="كغ">كغ</option>
        <option value="ليتر">ليتر</option>
        <option value="علبه">علبه</option>
        <option value="ربطة">ربطة</option>
        <option value="قطعة">قطعة</option>
      </select>
    </div>
    <button class="btn-submit" onclick="saveEditedArchiveItem()">💾 حفظ التعديل</button>
    <button class="btn-danger" onclick="deleteArchiveItemFromModal()">🗑️ حذف هذه المادة نهائياً</button>
  </div>
</div>

<!-- نافذة الآلة الحاسبة -->
<div id="calculatorModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title">
      <span>🧮 الآلة الحاسبة</span>
      <button class="sheet-close" onclick="closeCalculator()">✕</button>
    </div>
    <div class="calculator-grid">
      <div class="calc-screen" id="calcScreen">0</div>
      <button class="calc-btn mem" onclick="calcMemory('MC')">MC</button>
      <button class="calc-btn mem" onclick="calcMemory('MR')">MR</button>
      <button class="calc-btn mem" onclick="calcMemory('M+')">M+</button>
      <button class="calc-btn clear" onclick="clearCalc()">C</button>
      <button class="calc-btn" onclick="deleteCalcChar()">⌫</button>
      <button class="calc-btn op" onclick="pressCalc('/')">÷</button>
      <button class="calc-btn op" onclick="pressCalc('*')">×</button>
      <button class="calc-btn op" onclick="pressCalc('-')">-</button>
      <button class="calc-btn" onclick="pressCalc('7')">7</button>
      <button class="calc-btn" onclick="pressCalc('8')">8</button>
      <button class="calc-btn" onclick="pressCalc('9')">9</button>
      <button class="calc-btn op" onclick="pressCalc('+')">+</button>
      <button class="calc-btn" onclick="pressCalc('4')">4</button>
      <button class="calc-btn" onclick="pressCalc('5')">5</button>
      <button class="calc-btn" onclick="pressCalc('6')">6</button>
      <button class="calc-btn equal" onclick="calculateResult()">=</button>
      <button class="calc-btn" onclick="pressCalc('1')">1</button>
      <button class="calc-btn" onclick="pressCalc('2')">2</button>
      <button class="calc-btn" onclick="pressCalc('3')">3</button>
      <button class="calc-btn" onclick="pressCalc('0')" style="grid-column: span 2;">0</button>
      <button class="calc-btn" onclick="pressCalc('.')">.</button>
    </div>
  </div>
</div>

<!-- نافذة الأرشيف والسجل الشهري -->
<div id="monthlyModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title">
      <span>📅 الأرشيف والسجل الشهري وحفظ PDF</span>
      <button class="sheet-close" onclick="closeMonthlyReport()">✕</button>
    </div>

    <div class="month-picker-row">
      <select id="yearSelect" class="select-field" onchange="loadSelectedMonthData()">
        <option value="2026" selected>2026</option>
        <option value="2025">2025</option>
      </select>
      <select id="monthSelect" class="select-field" onchange="loadSelectedMonthData()">
        <option value="1">كانون الثاني (يناير)</option>
        <option value="2">شباط (فبراير)</option>
        <option value="3">آذار (مارس)</option>
        <option value="4">نيسان (أبريل)</option>
        <option value="5">أيار (مايو)</option>
        <option value="6">حزيران (يونيو)</option>
        <option value="7">تموز (يوليو)</option>
        <option value="8">آب (أغسطس)</option>
        <option value="9">أيلول (سبتمبر)</option>
        <option value="10" selected>تشرين الأول (أكتوبر)</option>
        <option value="11">تشرين الثاني (نوفمبر)</option>
        <option value="12">كانون الأول (ديسمبر)</option>
      </select>
    </div>

    <div id="monthlyReportPrintable">
      <div id="monthlyContent" style="background: var(--card); padding: 16px; border-radius: 16px; border: 1px solid var(--border);">
        <p style="text-align: center; color: var(--text-light);">جارِ جلب الأرشيف...</p>
      </div>
    </div>

    <button class="pdf-btn" onclick="downloadPDF()">📄 حفظ الأرشيف كملف PDF</button>
  </div>
</div>

<script>
let allItemsCache = [];
const ARCHIVE_KEY = 'baytna_archive_list';

function todayKey() { return 'baytna_items_' + new Date().toDateString(); }

function displayTodayHeaderInfo() {
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const todayStr = new Date().toLocaleDateString('ar-SY', options);
  const el = document.getElementById('dateDisplayString');
  if (el) el.innerText = todayStr;
}

function readArchive() {
  try { return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]'); }
  catch (e) { return []; }
}
function writeArchive(list) {
  localStorage.setItem(ARCHIVE_KEY, JSON.stringify(list));
}

/* ============ الأرشفة الموحّدة (تمنع التكرار) ============ */
function archiveItemsToStore(items, dateObj, silent) {
  if (!items || items.length === 0) return 0;
  const archive = readArchive();
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const formattedDate = dateObj.toLocaleDateString('ar-SY', options);
  const baseTs = dateObj.getTime();
  let added = 0;

  items.forEach((item, idx) => {
    const archId = 'arch_' + item.id + '_' + baseTs;
    if (archive.some(x => x.archId === archId)) return;
    archive.push({
      ...item,
      archId,
      archivedDate: formattedDate,
      timestamp: baseTs + idx
    });
    added++;
  });

  writeArchive(archive);
  localStorage.setItem('baytna_last_archive_date', new Date().toDateString());
  if (!silent && added > 0) console.log(`تمت أرشفة ${added} مادة.`);
  return added;
}

/* ============ تسجيل الدخول ============ */
window.doLogin = function() {
  const nameInput = document.getElementById('usernameInput');
  const name = nameInput ? nameInput.value.trim() : "حسان";
  localStorage.setItem('baytna_user', name);

  const userDisplay = document.getElementById('usernameDisplay');
  if (userDisplay) userDisplay.innerText = name;

  const loginScr = document.getElementById('loginScreen');
  const homeScr = document.getElementById('homeScreen');
  if (loginScr) loginScr.style.display = 'none';
  if (homeScr) homeScr.style.display = 'block';

  displayTodayHeaderInfo();
  loadTodayLocalItems();

  setTimeout(() => {
    if (typeof autoArchiveOrphans === 'function') autoArchiveOrphans(true);
  }, 400);
};

window.logout = function() {
  localStorage.removeItem('baytna_user');
  const homeScr = document.getElementById('homeScreen');
  const loginScr = document.getElementById('loginScreen');
  if (homeScr) homeScr.style.display = 'none';
  if (loginScr) loginScr.style.display = 'flex';
};

/* ============ نموذج الإضافة ============ */
window.openAddItemModal = function() {
  document.getElementById('itemNameInput').value = '';
  document.getElementById('itemPriceInput').value = '';
  document.getElementById('itemWeightInput').value = '';
  document.getElementById('itemUnitInput').value = 'كغ';
  document.getElementById('addItemModal').style.display = 'flex';
  setTimeout(() => document.getElementById('itemNameInput').focus(), 100);
};

window.closeAddItemModal = function() {
  document.getElementById('addItemModal').style.display = 'none';
};

window.submitNewItem = function() {
  const name = document.getElementById('itemNameInput').value.trim();
  const price = document.getElementById('itemPriceInput').value;
  const weight = document.getElementById('itemWeightInput').value;
  const unit = document.getElementById('itemUnitInput').value;

  if (!name) { alert("يرجى إدخال اسم المادة."); return; }

  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const formattedDate = new Date().toLocaleDateString('ar-SY', options);

  const newItem = {
    id: 'local_' + Date.now(),
    name: name,
    price: parseFloat(price) || 0,
    weight: parseFloat(weight) || 1,
    unit: unit,
    status: 'active',
    date: formattedDate,
    formattedDate: formattedDate
  };

  allItemsCache.unshift(newItem);
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
  closeAddItemModal();
};

/* ============ تحميل / حفظ اليوم ============ */
function loadTodayLocalItems() {
  const saved = localStorage.getItem(todayKey());
  try { allItemsCache = saved ? JSON.parse(saved) : []; }
  catch (e) { allItemsCache = []; }
  window.renderItemsList(allItemsCache);
}

function saveTodayLocalItems() {
  localStorage.setItem(todayKey(), JSON.stringify(allItemsCache));
}

/* ============ الأرشفة اليدوية ============ */
window.archiveCurrentDay = function() {
  if (allItemsCache.length === 0) {
    alert("لا توجد مواد مسجلة اليوم لأرشفتها!");
    return;
  }
  if (!confirm("هل أنت متأكد من أرشفة مشتريات اليوم في السجل الشهري، وبدء صفحة يوم جديد نظيفة؟\n(ملاحظة: تُحفظ نسخة في السجل، وتُفرَّغ صفحة اليوم)")) return;

  const added = archiveItemsToStore(allItemsCache, new Date(), false);
  allItemsCache = [];
  localStorage.removeItem(todayKey());
  window.renderItemsList(allItemsCache);

  alert(`تمت أرشفة ${added} مادة بنجاح وأصبح لديك صفحة يوم جديد نظيفة!`);
};

/* ============ الأرشفة التلقائية للأيام المعلّقة ============ */
window.autoArchiveOrphans = function(silent) {
  const tKey = new Date().toDateString();
  const orphanDays = [];

  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('baytna_items_')) {
      const dayStr = key.replace('baytna_items_', '');
      if (dayStr !== tKey) {
        try {
          const items = JSON.parse(localStorage.getItem(key) || '[]');
          if (items.length > 0) orphanDays.push({ key, dayStr, items });
        } catch (e) {}
      }
    }
  }

  if (orphanDays.length === 0) return;
  const totalItems = orphanDays.reduce((s, d) => s + d.items.length, 0);

  if (!silent) {
    const msg = `يوجد ${totalItems} مادة من ${orphanDays.length} يوم سابق غير مؤرشفة:\n` +
                orphanDays.map(d => `• ${d.dayStr} (${d.items.length} مادة)`).join('\n') +
                `\n\nهل تريد أرشفتها الآن إلى السجل الشهري؟`;
    if (!confirm(msg)) return;
  }

  let added = 0;
  orphanDays.forEach(d => {
    const dDate = new Date(d.dayStr);
    added += archiveItemsToStore(d.items, dDate, silent);
    localStorage.removeItem(d.key);
  });

  if (!silent) alert(`تمت أرشفة ${added} مادة بنجاح.`);
  if (typeof loadSelectedMonthData === 'function') loadSelectedMonthData();
};

/* ============ الحاسبة ============ */
let calcExpression = "";
let calcMemoryValue = 0;

window.openCalculator = function() { document.getElementById('calculatorModal').style.display = 'flex'; };
window.closeCalculator = function() { document.getElementById('calculatorModal').style.display = 'none'; };
window.pressCalc = function(val) { calcExpression += val; document.getElementById('calcScreen').innerText = calcExpression; };
window.clearCalc = function() { calcExpression = ""; document.getElementById('calcScreen').innerText = "0"; };
window.deleteCalcChar = function() { calcExpression = calcExpression.slice(0, -1); document.getElementById('calcScreen').innerText = calcExpression || "0"; };
window.calculateResult = function() {
  try {
    let res = eval(calcExpression);
    document.getElementById('calcScreen').innerText = res;
    calcExpression = res.toString();
  } catch (e) {
    document.getElementById('calcScreen').innerText = "خطأ";
    calcExpression = "";
  }
};
window.calcMemory = function(action) {
  const s = document.getElementById('calcScreen');
  if (action === 'MC') { calcMemoryValue = 0; s.innerText = "0"; calcExpression = ""; }
  else if (action === 'MR') { calcExpression += calcMemoryValue.toString(); s.innerText = calcExpression; }
  else if (action === 'M+') {
    try {
      const currentVal = eval(calcExpression) || 0;
      calcMemoryValue += currentVal;
      s.innerText = "تم الحفظ";
      setTimeout(() => { s.innerText = calcExpression || "0"; }, 800);
    } catch(e) {}
  }
};

/* ============ عرض مواد اليوم ============ */
window.renderItemsList = function(items) {
  const listContainer = document.getElementById('itemsList');
  if (!listContainer) return;
  let html = "";
  let totalP = 0, doneCount = 0, activeCount = 0;

  items.sort((a, b) => {
    const sa = a.status || 'active';
    const sb = b.status || 'active';
    if (sa === 'active' && sb !== 'active') return -1;
    if (sa !== 'active' && sb === 'active') return 1;
    return 0;
  });

  items.forEach((data) => {
    const p = parseFloat(data.price) || 0;
    const w = parseFloat(data.weight) || 1;
    const u = data.unit || 'كغ';
    const status = data.status || 'active';
    const sub = p * w;

    if (status !== 'cancelled') {
      totalP += sub;
      if (status === 'done') doneCount++;
      else activeCount++;
    }

    let statusBadge = "", cardStyle = "", nameStyle = "";
    if (status === 'done') {
      statusBadge = ' <span style="color:var(--success-dark); font-size:12px; font-weight:700;">(✓ تم شراؤه)</span>';
      cardStyle = 'background: #E8F5E9; border-color: #7BA77E; opacity: 0.85;';
      nameStyle = 'text-decoration: line-through; color: var(--success-dark);';
    } else if (status === 'cancelled') {
      statusBadge = ' <span style="color:var(--danger); font-size:12px; font-weight:700;">(✕ ملغى)</span>';
      cardStyle = 'background: #FBF5F3; border-color: #F0D5CF; opacity: 0.7;';
      nameStyle = 'text-decoration: line-through; color: var(--danger);';
    }

    html += `
      <div class="item-card" style="${cardStyle}">
        <div class="item-header">
          <div>
            <div class="item-name" style="${nameStyle}">${data.name}${statusBadge}</div>
            <div class="item-meta">
              <span>${data.formattedDate || data.date || ''}</span>
              <span class="item-badge" style="background: #FFF; border: 1px solid #CCC;">${u}</span>
            </div>
          </div>
        </div>
        <div class="item-price-info">
          <span class="item-price-badge" style="background: #FFF;">${p.toFixed(2)} $ × ${w} ${u}</span>
          <span class="item-total-badge" style="${status==='done'?'background:#4A7C4E;':''}">${sub.toFixed(2)} $</span>
        </div>
        <div class="item-actions" style="border-top-color: ${status==='done'?'#C8E6C9':'var(--border)'};">
          <button class="action-btn edit" onclick="editItem('${data.id}')">تعديل</button>
          <button class="action-btn done" onclick="markItemDone('${data.id}')">تم الشراء</button>
          <button class="action-btn cancel" onclick="cancelItem('${data.id}')">إلغاء</button>
          <button class="action-btn delete" onclick="deleteItem('${data.id}')">حذف</button>
        </div>
      </div>
    `;
  });

  listContainer.innerHTML = html || '<p style="text-align:center;color:var(--text-light);padding:40px 0;">لا توجد مواد اليوم بعد. أضف مادة جديدة للبدء.</p>';

  const totalEl = document.getElementById('totalPrice');
  const weightEl = document.getElementById('totalWeight');
  const doneEl = document.getElementById('doneCount');
  const activeEl = document.getElementById('activeCount');
  if (totalEl) totalEl.innerText = totalP.toFixed(2);
  if (weightEl) weightEl.innerText = items.length;
  if (doneEl) doneEl.innerText = doneCount;
  if (activeEl) activeEl.innerText = activeCount;
};

window.filterTodayItems = function() {
  const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  if (!q) return window.renderItemsList(allItemsCache);
  const filtered = allItemsCache.filter(it => (it.name || '').toLowerCase().includes(q));
  window.renderItemsList(filtered);
};

/* ============ إجراءات على مواد اليوم ============ */
window.editItem = function(id) {
  const item = allItemsCache.find(i => i.id === id);
  if (!item) return;
  const name = prompt("اسم المادة:", item.name);
  if (name === null) return;
  const price = prompt("السعر ($):", item.price);
  if (price === null) return;
  const weight = prompt("الكمية:", item.weight);
  if (weight === null) return;
  item.name = name.trim() || item.name;
  item.price = parseFloat(price) || 0;
  item.weight = parseFloat(weight) || 1;
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
};

window.markItemDone = function(id) {
  const item = allItemsCache.find(i => i.id === id);
  if (!item) return;
  item.status = 'done';
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
};

window.cancelItem = function(id) {
  const item = allItemsCache.find(i => i.id === id);
  if (!item) return;
  item.status = 'cancelled';
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
};

window.deleteItem = function(id) {
  if (!confirm("هل تريد حذف هذه المادة نهائياً؟")) return;
  allItemsCache = allItemsCache.filter(i => i.id !== id);
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
};

/* ============ السجل الشهري ============ */
window.showMonthlyReport = function() {
  document.getElementById('monthlyModal').style.display = 'flex';
  if (allItemsCache.length > 0) {
    archiveItemsToStore(allItemsCache, new Date(), true);
  }
  if (typeof autoArchiveOrphans === 'function') autoArchiveOrphans(true);
  loadSelectedMonthData();
};

window.closeMonthlyReport = function() {
  document.getElementById('monthlyModal').style.display = 'none';
};

window.loadSelectedMonthData = function() {
  const year = parseInt(document.getElementById('yearSelect')?.value || '2026');
  const month = parseInt(document.getElementById('monthSelect')?.value || '10');
  const container = document.getElementById('monthlyContent');
  if (!container) return;

  const archive = readArchive();

  const monthItems = archive.filter(it => {
    const t = it.timestamp ? new Date(it.timestamp) : null;
    return t && t.getFullYear() === year && (t.getMonth() + 1) === month;
  });

  if (monthItems.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:var(--text-light);padding:30px 0;">لا توجد بيانات مؤرشفة لهذا الشهر.</p>';
    return;
  }

  const byDay = {};
  monthItems.forEach(it => {
    const t = new Date(it.timestamp);
    const dayKey = t.getDate();
    if (!byDay[dayKey]) byDay[dayKey] = { items: [], total: 0, label: it.archivedDate || t.toLocaleDateString('ar-SY') };
    const sub = (parseFloat(it.price) || 0) * (parseFloat(it.weight) || 1);
    byDay[dayKey].items.push(it);
    byDay[dayKey].total += sub;
  });

  const days = Object.keys(byDay).map(Number).sort((a, b) => a - b);
  let grandTotal = 0;
  let totalCount = 0;
  let html = `<div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--primary-dark);">
    سجل ${month}/${year} — ${monthItems.length} مادة
  </div>`;

  days.forEach(dayNum => {
    const g = byDay[dayNum];
    grandTotal += g.total;
    totalCount += g.items.length;
    const dayKeyStr = `${year}-${month}-${dayNum}`;
    let rows = "";
    g.items.forEach(it => {
      const sub = (parseFloat(it.price) || 0) * (parseFloat(it.weight) || 1);
      const statusTag = it.status === 'cancelled' ? ' <span style="color:var(--danger);font-size:11px;">(ملغى)</span>' : '';
      rows += `<div class="day-row">
        <span class="row-label">${it.name}${statusTag} (${it.weight} ${it.unit || 'كغ'}) — <b>${sub.toFixed(2)} $</b></span>
        <span class="row-actions">
          <button class="mini-btn edit" onclick="openEditArchiveItem('${it.archId}')" title="تعديل">✏️</button>
          <button class="mini-btn del" onclick="deleteArchiveItem('${it.archId}')" title="حذف">🗑️</button>
        </span>
      </div>`;
    });

    html += `
      <div class="day-group">
        <div class="day-group-header">
          <span>📅 ${g.label}</span>
          <span class="day-total">${g.total.toFixed(2)} $</span>
          <span class="day-actions">
            <button class="mini-btn move" onclick="moveDayToAnotherDate('${dayKeyStr}')" title="نقل اليوم لتاريخ آخر">🗓️ نقل</button>
            <button class="mini-btn del" onclick="deleteWholeDay('${dayKeyStr}')" title="حذف اليوم كاملاً">🗑️ حذف اليوم</button>
          </span>
        </div>
        <div class="day-group-body">${rows}</div>
      </div>
    `;
  });

  html += `<div class="month-grand-total">
    <span>الإجمالي الشهري (${totalCount} مادة)</span>
    <span>${grandTotal.toFixed(2)} $</span>
  </div>`;

  container.innerHTML = html;
};

/* ============ تعديل / حذف مادة في السجل ============ */
window.openEditArchiveItem = function(archId) {
  const archive = readArchive();
  const item = archive.find(x => x.archId === archId);
  if (!item) { alert("لم يتم العثور على المادة في السجل."); return; }

  document.getElementById('editItemArchId').value = archId;
  document.getElementById('editItemName').value = item.name || '';
  document.getElementById('editItemPrice').value = item.price || 0;
  document.getElementById('editItemWeight').value = item.weight || 1;
  document.getElementById('editItemUnit').value = item.unit || 'كغ';
  document.getElementById('editItemModal').style.display = 'flex';
};

window.closeEditItemModal = function() {
  document.getElementById('editItemModal').style.display = 'none';
};

window.saveEditedArchiveItem = function() {
  const archId = document.getElementById('editItemArchId').value;
  const name = document.getElementById('editItemName').value.trim();
  const price = parseFloat(document.getElementById('editItemPrice').value) || 0;
  const weight = parseFloat(document.getElementById('editItemWeight').value) || 1;
  const unit = document.getElementById('editItemUnit').value;

  if (!name) { alert("اسم المادة مطلوب."); return; }

  const archive = readArchive();
  const idx = archive.findIndex(x => x.archId === archId);
  if (idx === -1) { alert("لم يتم العثور على المادة."); return; }

  archive[idx].name = name;
  archive[idx].price = price;
  archive[idx].weight = weight;
  archive[idx].unit = unit;
  writeArchive(archive);

  closeEditItemModal();
  loadSelectedMonthData();
};

window.deleteArchiveItemFromModal = function() {
  const archId = document.getElementById('editItemArchId').value;
  closeEditItemModal();
  deleteArchiveItem(archId);
};

window.deleteArchiveItem = function(archId) {
  if (!confirm("هل تريد حذف هذه المادة نهائياً من السجل الشهري؟")) return;
  const archive = readArchive().filter(x => x.archId !== archId);
  writeArchive(archive);
  loadSelectedMonthData();
};

/* ============ حذف يوم كامل / نقله ============ */
window.deleteWholeDay = function(dayKeyStr) {
  const [y, m, d] = dayKeyStr.split('-').map(Number);
  if (!confirm(`هل تريد حذف جميع مواد يوم ${d}/${m}/${y} من السجل الشهري نهائياً؟`)) return;

  const archive = readArchive().filter(it => {
    if (!it.timestamp) return true;
    const t = new Date(it.timestamp);
    return !(t.getFullYear() === y && (t.getMonth() + 1) === m && t.getDate() === d);
  });
  writeArchive(archive);
  loadSelectedMonthData();
  alert("تم حذف اليوم بالكامل من السجل.");
};

window.moveDayToAnotherDate = function(dayKeyStr) {
  const [y, m, d] = dayKeyStr.split('-').map(Number);
  const input = prompt(
    `نقل جميع مواد يوم ${d}/${m}/${y} إلى تاريخ جديد.\nأدخل التاريخ بصيغة YYYY-MM-DD (مثال: 2026-10-15):`,
    `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`
  );
  if (!input) return;

  const parts = input.split('-').map(Number);
  if (parts.length !== 3 || parts.some(isNaN)) { alert("صيغة التاريخ غير صحيحة. استخدم YYYY-MM-DD."); return; }
  const [ny, nm, nd] = parts;
  const newDate = new Date(ny, nm - 1, nd);
  if (isNaN(newDate.getTime())) { alert("تاريخ غير صالح."); return; }

  const archive = readArchive();
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const newLabel = newDate.toLocaleDateString('ar-SY', options);
  const newBaseTs = newDate.getTime();

  let count = 0;
  archive.forEach(it => {
    if (!it.timestamp) return;
    const t = new Date(it.timestamp);
    if (t.getFullYear() === y && (t.getMonth() + 1) === m && t.getDate() === d) {
      // نعيد بناء timestamp و archId لتفادي التعارض
      it.timestamp = newBaseTs + count;
      it.archivedDate = newLabel;
      it.archId = 'arch_' + (it.id || 'x') + '_' + it.timestamp;
      count++;
    }
  });

  writeArchive(archive);
  loadSelectedMonthData();
  alert(`تم نقل ${count} مادة إلى ${newLabel}.`);
};

window.downloadPDF = function() {
  const el = document.getElementById('monthlyReportPrintable');
  if (!el || typeof html2pdf === 'undefined') return;
  html2pdf().set({
    margin: 10,
    filename: 'baytna_report.pdf',
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(el).save();
};

/* ============ استعادة الجلسة ============ */
(function restoreSession() {
  const saved = localStorage.getItem('baytna_user');
  if (saved) {
    const nameInput = document.getElementById('usernameInput');
    if (nameInput) nameInput.value = saved;
    window.doLogin();
  } else {
    displayTodayHeaderInfo();
    setTimeout(() => { if (typeof autoArchiveOrphans === 'function') autoArchiveOrphans(true); }, 300);
  }
})();

window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && allItemsCache.length > 0) {
    archiveItemsToStore(allItemsCache, new Date(), true);
  }
});
</script>
</body>
</html>
