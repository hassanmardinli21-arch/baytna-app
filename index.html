<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6B9080">
<title>بيتنا</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F1EA; --card: #FFFFFF;
    --primary: #6B9080; --primary-dark: #4A6D5F;
    --accent: #C9A58D; --text: #2D3A3A; --text-light: #7A8787;
    --border: #EAE3D9; --danger: #B87B6E;
    --success: #7BA77E; --success-dark: #4A7C4E;
    --warning: #D4A55C;
    --shadow: 0 2px 12px rgba(45, 58, 58, 0.06);
    --shadow-lg: 0 12px 40px rgba(45, 58, 58, 0.18);
  }
  html, body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body { padding-bottom: 100px; }
  .login-wrap { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; background: linear-gradient(160deg, #F5F1EA 0%, #E8DFD2 100%); }
  .login-logo { width: 90px; height: 90px; border-radius: 28px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); display: flex; align-items: center; justify-content: center; font-size: 44px; margin-bottom: 24px; box-shadow: 0 12px 32px rgba(107, 144, 128, 0.3); }
  .login-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .login-sub { color: var(--text-light); font-size: 15px; margin-bottom: 40px; }
  .login-form { width: 100%; max-width: 360px; }
  .input-group { margin-bottom: 16px; }
  .input-label { font-size: 14px; color: var(--text-light); margin-bottom: 8px; display: block; font-weight: 500; }
  .input-field { width: 100%; padding: 16px 18px; border: 2px solid var(--border); border-radius: 16px; background: var(--card); font-size: 16px; font-family: inherit; color: var(--text); }
  .btn { width: 100%; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; box-shadow: 0 4px 16px rgba(107, 144, 128, 0.25); }
  .app-header { position: sticky; top: 0; z-index: 100; background: rgba(245, 241, 234, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-title span { color: var(--primary); }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn { width: 42px; height: 42px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: var(--shadow); }
  .sync-badge { font-size: 11px; padding: 4px 8px; border-radius: 8px; font-weight: 700; }
  .sync-badge.online { background: #E8F5E9; color: #2E7D32; }
  .sync-badge.offline { background: #FFF3E0; color: #E65100; }
  .sync-badge.syncing { background: #E3F2FD; color: #1565C0; }
  .container { max-width: 560px; margin: 0 auto; padding: 16px 20px; }
  .summary-card { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 22px; border-radius: 22px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(107, 144, 128, 0.25); }
  .summary-row { display: flex; justify-content: space-between; align-items: center; }
  .summary-label { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
  .summary-value { font-size: 32px; font-weight: 700; }
  .summary-stats { display: flex; gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.2); }
  .summary-stat { flex: 1; }
  .summary-stat-label { font-size: 12px; opacity: 0.8; margin-bottom: 2px; }
  .summary-stat-value { font-size: 18px; font-weight: 700; }
  .action-main-btn { width: 100%; padding: 16px; margin-bottom: 12px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 18px rgba(107, 144, 128, 0.25); }
  .archive-day-btn { width: 100%; padding: 16px; margin-bottom: 12px; border: none; border-radius: 16px; background: linear-gradient(135deg, #2D3A3A 0%, #1A2222 100%); color: white; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 18px rgba(45, 58, 58, 0.3); }
  .monthly-big-btn { width: 100%; padding: 16px; margin-bottom: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%); color: white; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 18px rgba(184, 123, 58, 0.3); }
  .today-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; margin-bottom: 12px; background: linear-gradient(135deg, #FFFFFF 0%, #F0EBE0 100%); border: 1px solid var(--border); border-radius: 14px; font-size: 14px; font-weight: 700; color: var(--primary-dark); }
  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-input { width: 100%; padding: 14px 44px 14px 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); font-size: 15px; font-family: inherit; color: var(--text); }
  .item-card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); transition: all 0.3s ease; }
  .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
  .item-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .item-meta { font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-badge { padding: 3px 8px; border-radius: 6px; background: #F0EBE0; font-size: 11px; color: var(--text-light); }
  .item-price-info { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; justify-content: space-between; }
  .item-total-badge { padding: 5px 12px; border-radius: 10px; background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%); color: white; font-size: 14px; font-weight: 700; }
  .item-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .action-btn { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .action-btn.edit { color: var(--primary-dark); border-color: var(--primary); }
  .action-btn.done { color: var(--success-dark); border-color: var(--success); }
  .action-btn.cancel { color: var(--warning); border-color: var(--warning); }
  .action-btn.delete { color: var(--danger); border-color: var(--danger); }
  .calc-fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #4A6D5F 0%, #2D3A3A 100%); color: white; border: none; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(45, 58, 58, 0.35); z-index: 90; }
  .calculator-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
  .calc-screen { grid-column: span 4; background: #2D3A3A; color: #FFFFFF; font-size: 28px; font-weight: 700; text-align: left; padding: 18px; border-radius: 16px; min-height: 65px; display: flex; align-items: center; justify-content: flex-end; direction: ltr; }
  .calc-btn { padding: 14px; font-size: 18px; font-weight: 700; border-radius: 14px; border: 1.5px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .calc-btn.op { background: #E8EEF2; color: var(--primary-dark); }
  .calc-btn.equal { background: var(--primary); color: white; border: none; grid-row: span 2; }
  .calc-btn.clear { background: #FFF5F3; color: var(--danger); border-color: #F0D5CF; }
  .calc-btn.mem { background: #F0EBE0; color: var(--text); font-size: 14px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(45, 58, 58, 0.5); backdrop-filter: blur(4px); z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px; }
  .sheet { width: 100%; max-width: 480px; background: var(--bg); border-radius: 24px; padding: 24px; overflow-y: auto; max-height: 90vh; box-shadow: var(--shadow-lg); }
  .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  .sheet-close { width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .month-picker-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .select-field { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); font-size: 14px; font-weight: 600; }
  .pdf-btn { width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 14px; background: linear-gradient(135deg, #B87B6E 0%, #8A4238 100%); color: white; font-size: 15px; font-weight: 700; cursor: pointer; }
  .form-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .form-group { flex: 1; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; }
  .form-control { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 15px; font-family: inherit; outline: none; }
  .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(107, 144, 128, 0.1); }
  .btn-submit { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
  .btn-danger { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--danger); background: #FFF5F3; color: var(--danger); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .day-group { margin-bottom: 14px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .day-group-header { background: #F0EBE0; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: var(--primary-dark); gap: 8px; flex-wrap: wrap; }
  .day-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 6px; }
  .day-row:last-child { border-bottom: none; }
  .row-actions { display: flex; gap: 4px; }
  .mini-btn { padding: 4px 9px; border-radius: 7px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .mini-btn.del { color: var(--danger); border-color: #E5C2BB; }
  .mini-btn.move { color: var(--primary-dark); border-color: var(--primary); }
  .mini-btn.edit { color: var(--warning); border-color: #E8CFA0; }
  .day-group-body { padding: 6px 12px; }
  .month-grand-total { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 10px; border-top: 2px solid var(--primary); font-weight: 700; font-size: 15px; }
  .backup-actions { display: flex; gap: 10px; margin-top: 16px; }
  .backup-actions .btn { flex: 1; padding: 12px; font-size: 14px; background: var(--card); color: var(--primary-dark); border: 1px solid var(--primary); box-shadow: none; }
  .backup-actions input[type="file"] { display: none; }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen" class="login-wrap">
  <div class="login-logo">🏠</div>
  <div class="login-title">بيتنا</div>
  <div class="login-sub">إدارة مخزون المنزل بذكاء</div>
  <div class="login-form">
    <div class="input-group">
      <label class="input-label">البريد الإلكتروني</label>
      <input type="email" id="emailInput" class="input-field" value="hassanmardinli21@gmail.com" autocomplete="username" dir="ltr" required>
    </div>
    <div class="input-group">
      <label class="input-label">كلمة المرور</label>
      <input type="password" id="passwordInput" class="input-field" placeholder="أدخل كلمة المرور" autocomplete="current-password" dir="ltr" required>
    </div>
    <div class="input-group">
      <label class="input-label">الاسم الظاهر (اختياري)</label>
      <input type="text" id="usernameInput" class="input-field" value="حسان" autocomplete="name">
    </div>
    <button class="btn" type="button" id="loginButton" onclick="doLogin()">تسجيل الدخول</button>
    <button class="btn" type="button" style="margin-top:10px;background:#4A6D5F;" onclick="registerAccount()">إنشاء حساب جديد</button>
    <button type="button" onclick="resetPassword()" style="display:block;margin:16px auto 0;border:0;background:transparent;color:var(--primary-dark);font:inherit;cursor:pointer;">نسيت كلمة المرور؟</button>
    <p id="authMessage" role="status" style="margin-top:14px;text-align:center;font-size:13px;line-height:1.7;color:var(--danger);"></p>
  </div>
</div>

<!-- الشاشة الرئيسية -->
<div id="homeScreen" style="display: none;">
  <div class="app-header">
    <div class="header-title">بيت <span id="usernameDisplay">حسان</span> <span>🏠</span></div>
    <div class="header-actions">
      <span id="syncBadge" class="sync-badge syncing">⏳ جارٍ</span>
      <button class="icon-btn" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
      <button class="icon-btn" onclick="showMonthlyReport()" title="الأرشيف والسجل الشهري">📅</button>
      <button class="icon-btn" onclick="logout()" title="خروج">🚪</button>
    </div>
  </div>

  <div class="container">
    <!-- بطاقة الملخص العلوي -->
    <div class="summary-card">
      <div class="summary-row">
        <div>
          <div class="summary-label">💰 إجمالي مشتريات اليوم</div>
          <div class="summary-value"><span id="totalPrice">0.00</span> <small>$</small></div>
        </div>
        <div style="font-size: 40px; opacity: 0.4;">🛒</div>
      </div>
      <div class="summary-stats">
        <div class="summary-stat">
          <div class="summary-stat-label">📦 إجمالي المواد</div>
          <div class="summary-stat-value"><span id="totalWeight">0</span> <small style="font-size:12px;">مادة</small></div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">✅ مكتملة</div>
          <div class="summary-stat-value"><span id="doneCount">0</span></div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">⏳ معلّقة</div>
          <div class="summary-stat-value"><span id="activeCount">0</span></div>
        </div>
      </div>
    </div>

    <button class="action-main-btn" onclick="openAddItemModal()">➕ إضافة مادة جديدة لليوم</button>
    <button class="archive-day-btn" onclick="archiveCurrentDay()">📥 أرشفة ونهاية اليوم (ترحيل للسجل وبدء يوم جديد)</button>
    <button class="monthly-big-btn" onclick="showMonthlyReport()">📅 تصفح السجل الشهري والأرشيف وحفظ PDF</button>

    <div class="today-bar" id="currentDateBar">
      <span>📅 نشاط اليوم</span>
      <span id="dateDisplayString" style="color: var(--text-light); font-size: 12.5px;"></span>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث في مواد اليوم..." oninput="filterTodayItems()">
    </div>

    <div id="itemsList"></div>

    <div class="backup-actions">
        <button class="btn" onclick="exportData()">📤 تصدير البيانات</button>
        <label class="btn" style="text-align:center; justify-content:center; display:flex; cursor:pointer;">
            📥 استيراد البيانات
            <input type="file" id="importFile" accept=".json" onchange="importData(event)">
        </label>
    </div>
  </div>

  <button class="calc-fab" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
</div>

<!-- نافذة إضافة مادة جديدة -->
<div id="addItemModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title"><span>➕ إضافة مادة جديدة</span><button class="sheet-close" onclick="closeAddItemModal()">✕</button></div>
    <div class="form-group"><label class="form-label">اسم المادة</label><input type="text" id="itemNameInput" class="form-control" placeholder="مثال: تفاح أحمر"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">السعر ($)</label><input type="number" id="itemPriceInput" class="form-control" placeholder="0.00" step="0.01"></div>
      <div class="form-group"><label class="form-label">الكمية</label><input type="number" id="itemWeightInput" class="form-control" placeholder="1"></div>
    </div>
    <div class="form-group" style="margin-bottom: 10px;">
      <label class="form-label">وحدة القياس</label>
      <select id="itemUnitInput" class="form-control"><option value="كغ">كغ</option><option value="ليتر">ليتر</option><option value="علبه">علبه</option><option value="ربطة">ربطة</option><option value="قطعة">قطعة</option></select>
    </div>
    <button class="btn-submit" onclick="submitNewItem()">حفظ المادة</button>
  </div>
</div>

<!-- نافذة تعديل مادة اليوم -->
<div id="editDailyItemModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title"><span>✏️ تعديل مادة اليوم</span><button class="sheet-close" onclick="closeEditDailyItemModal()">✕</button></div>
    <input type="hidden" id="editDailyItemId">
    <div class="form-group" style="margin-bottom:12px;"><label class="form-label">اسم المادة</label><input type="text" id="editDailyItemName" class="form-control"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">السعر ($)</label><input type="number" id="editDailyItemPrice" class="form-control" step="0.01"></div>
      <div class="form-group"><label class="form-label">الكمية</label><input type="number" id="editDailyItemWeight" class="form-control"></div>
    </div>
    <div class="form-group" style="margin-bottom:10px;"><label class="form-label">وحدة القياس</label><select id="editDailyItemUnit" class="form-control"><option value="كغ">كغ</option><option value="ليتر">ليتر</option><option value="علبه">علبه</option><option value="ربطة">ربطة</option><option value="قطعة">قطعة</option></select></div>
    <button class="btn-submit" onclick="saveEditedDailyItem()">💾 حفظ التعديل</button>
  </div>
</div>

<!-- نافذة تعديل مادة في السجل -->
<div id="editItemModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title"><span>✏️ تعديل مادة في السجل</span><button class="sheet-close" onclick="closeEditItemModal()">✕</button></div>
    <input type="hidden" id="editItemArchId">
    <div class="form-group" style="margin-bottom:12px;"><label class="form-label">اسم المادة</label><input type="text" id="editItemName" class="form-control"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">السعر ($)</label><input type="number" id="editItemPrice" class="form-control" step="0.01"></div>
      <div class="form-group"><label class="form-label">الكمية</label><input type="number" id="editItemWeight" class="form-control"></div>
    </div>
    <div class="form-group" style="margin-bottom:10px;"><label class="form-label">وحدة القياس</label><select id="editItemUnit" class="form-control"><option value="كغ">كغ</option><option value="ليتر">ليتر</option><option value="علبه">علبه</option><option value="ربطة">ربطة</option><option value="قطعة">قطعة</option></select></div>
    <button class="btn-submit" onclick="saveEditedArchiveItem()">💾 حفظ التعديل</button>
    <button class="btn-danger" onclick="deleteArchiveItemFromModal()">🗑️ حذف هذه المادة نهائياً</button>
  </div>
</div>

<!-- نافذة الآلة الحاسبة -->
<div id="calculatorModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title"><span>🧮 الآلة الحاسبة</span><button class="sheet-close" onclick="closeCalculator()">✕</button></div>
    <div class="calculator-grid">
      <div class="calc-screen" id="calcScreen">0</div>
      <button class="calc-btn mem" onclick="calcMemory('MC')">MC</button><button class="calc-btn mem" onclick="calcMemory('MR')">MR</button><button class="calc-btn mem" onclick="calcMemory('M+')">M+</button><button class="calc-btn clear" onclick="clearCalc()">C</button>
      <button class="calc-btn" onclick="deleteCalcChar()">⌫</button><button class="calc-btn op" onclick="pressCalc('/')">÷</button><button class="calc-btn op" onclick="pressCalc('*')">×</button><button class="calc-btn op" onclick="pressCalc('-')">-</button>
      <button class="calc-btn" onclick="pressCalc('7')">7</button><button class="calc-btn" onclick="pressCalc('8')">8</button><button class="calc-btn" onclick="pressCalc('9')">9</button><button class="calc-btn op" onclick="pressCalc('+')">+</button>
      <button class="calc-btn" onclick="pressCalc('4')">4</button><button class="calc-btn" onclick="pressCalc('5')">5</button><button class="calc-btn" onclick="pressCalc('6')">6</button><button class="calc-btn equal" onclick="calculateResult()">=</button>
      <button class="calc-btn" onclick="pressCalc('1')">1</button><button class="calc-btn" onclick="pressCalc('2')">2</button><button class="calc-btn" onclick="pressCalc('3')">3</button>
      <button class="calc-btn" onclick="pressCalc('0')" style="grid-column: span 2;">0</button><button class="calc-btn" onclick="pressCalc('.')">.</button>
    </div>
  </div>
</div>

<!-- نافذة الأرشيف والسجل الشهري -->
<div id="monthlyModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title"><span>📅 الأرشيف والسجل الشهري وحفظ PDF</span><button class="sheet-close" onclick="closeMonthlyReport()">✕</button></div>
    <div class="month-picker-row">
      <select id="yearSelect" class="select-field" onchange="loadSelectedMonthData()"><option value="2026" selected>2026</option><option value="2025">2025</option></select>
      <select id="monthSelect" class="select-field" onchange="loadSelectedMonthData()">
        <option value="1">كانون الثاني (يناير)</option><option value="2">شباط (فبراير)</option><option value="3">آذار (مارس)</option><option value="4">نيسان (أبريل)</option><option value="5">أيار (مايو)</option><option value="6">حزيران (يونيو)</option><option value="7">تموز (يوليو)</option><option value="8">آب (أغسطس)</option><option value="9">أيلول (سبتمبر)</option><option value="10" selected>تشرين الأول (أكتوبر)</option><option value="11">تشرين الثاني (نوفمبر)</option><option value="12">كانون الأول (ديسمبر)</option>
      </select>
    </div>
    <div id="monthlyReportPrintable"><div id="monthlyContent" style="background: var(--card); padding: 16px; border-radius: 16px; border: 1px solid var(--border);"><p style="text-align: center; color: var(--text-light);">جارِ جلب الأرشيف...</p></div></div>
    <button class="pdf-btn" onclick="downloadPDF()">📄 حفظ الأرشيف كملف PDF</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, query, where, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXVClsWhLOc3m710m2Fy6p5KncFIHQTCU",
  authDomain: "baytna-10.firebaseapp.com",
  projectId: "baytna-10",
  storageBucket: "baytna-10.firebasestorage.app",
  messagingSenderId: "480526325243",
  appId: "1:480526325243:web:444940ce97845bf727a75e",
  measurementId: "G-WWCZGDKZVV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const ITEMS_COLLECTION = "baytna_items";

let allItemsCache = [];
let currentUserUid = null;
let unsubscribeSnapshot = null;
let unsubscribeArchiveSnapshot = null;
let initialItemsSnapshotLoaded = false;
let initialArchiveSnapshotLoaded = false;
const ARCHIVE_KEY = 'baytna_archive_list';
const USER_PREFIX = 'baytna_user_';

function todayKey() { return 'baytna_items_' + new Date().toDateString(); }

function displayTodayHeaderInfo() {
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const el = document.getElementById('dateDisplayString');
  if (el) el.innerText = new Date().toLocaleDateString('ar-SY', options);
}

function readArchive() {
  try { return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]'); } catch (e) { return []; }
}
function writeArchive(list) { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(list)); }

function setSyncBadge(state) {
  const el = document.getElementById('syncBadge');
  if (!el) return;
  el.className = 'sync-badge ' + state;
  if (state === 'online') el.innerText = '☁️ متصل';
  else if (state === 'syncing') el.innerText = '⏳ جارٍ';
  else el.innerText = '⚠️ غير متصل';
}

function cloudItemRef(itemId) {
  return doc(db, ITEMS_COLLECTION, currentUserUid + "_" + itemId);
}

async function pushItemToCloud(item) {
  if (!currentUserUid) return;
  try {
    setSyncBadge('syncing');
    await setDoc(cloudItemRef(item.id), {
      ...item,
      uid: currentUserUid,
      updatedAt: new Date().toISOString()
    }, { merge: true });
    setSyncBadge('online');
  } catch (e) {
    console.error('pushItemToCloud', e);
    setSyncBadge('offline');
    showAuthMessage(firebaseErrorMessage(e), true);
  }
}

async function deleteItemFromCloud(itemId) {
  if (!currentUserUid) return;
  try {
    setSyncBadge('syncing');
    await deleteDoc(cloudItemRef(itemId));
    setSyncBadge('online');
  } catch (e) {
    console.error('deleteItemFromCloud', e);
    setSyncBadge('offline');
  }
}

async function pushArchiveToCloud(archiveList) {
  if (!currentUserUid) return;
  try {
    setSyncBadge('syncing');
    await setDoc(doc(db, "baytna_archives", currentUserUid), {
      uid: currentUserUid,
      list: archiveList,
      updatedAt: new Date().toISOString()
    }, { merge: true });
    setSyncBadge('online');
  } catch (e) {
    console.error('pushArchiveToCloud', e);
    setSyncBadge('offline');
    showAuthMessage(firebaseErrorMessage(e), true);
  }
}

function startCloudListener() {
  if (!currentUserUid) return;
  if (unsubscribeSnapshot) unsubscribeSnapshot();
  initialItemsSnapshotLoaded = false;
  const q = query(collection(db, ITEMS_COLLECTION), where('uid', '==', currentUserUid));
  unsubscribeSnapshot = onSnapshot(q, async (snapshot) => {
    const cloudItems = [];
    snapshot.forEach(d => cloudItems.push({ ...d.data(), id: d.data().id || d.id }));
    const todayFormatted = new Date().toLocaleDateString('ar-SY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const visibleCloudItems = cloudItems.filter(item => item.formattedDate === todayFormatted || item.status === 'active' || item.status === 'done');

    if (!initialItemsSnapshotLoaded) {
      const mergedById = new Map();
      allItemsCache.forEach(item => mergedById.set(item.id, item));
      visibleCloudItems.forEach(item => mergedById.set(item.id, item));
      allItemsCache = Array.from(mergedById.values());
      initialItemsSnapshotLoaded = true;
      saveTodayLocalItems();
      window.renderItemsList(allItemsCache);

      const cloudIds = new Set(cloudItems.map(item => item.id));
      for (const localItem of allItemsCache) {
        if (!cloudIds.has(localItem.id)) await pushItemToCloud(localItem);
      }
    } else {
      allItemsCache = visibleCloudItems;
      saveTodayLocalItems();
      window.renderItemsList(allItemsCache);
    }
    setSyncBadge('online');
  }, (error) => {
    console.error('items snapshot error', error);
    setSyncBadge('offline');
    showAuthMessage(firebaseErrorMessage(error), true);
  });
}

function startArchiveListener() {
  if (!currentUserUid) return;
  if (unsubscribeArchiveSnapshot) unsubscribeArchiveSnapshot();
  initialArchiveSnapshotLoaded = false;
  const archiveRef = doc(db, "baytna_archives", currentUserUid);
  unsubscribeArchiveSnapshot = onSnapshot(archiveRef, async (snapshot) => {
    const localArchive = readArchive();
    if (!snapshot.exists()) {
      if (!initialArchiveSnapshotLoaded && localArchive.length) {
        await pushArchiveToCloud(localArchive);
        return;
      }
      initialArchiveSnapshotLoaded = true;
      setSyncBadge('online');
      return;
    }
    const cloudArchive = Array.isArray(snapshot.data().list) ? snapshot.data().list : [];
    if (!initialArchiveSnapshotLoaded) {
      const merged = new Map();
      localArchive.forEach(item => merged.set(item.archId || item.id, item));
      cloudArchive.forEach(item => merged.set(item.archId || item.id, item));
      const mergedArchive = Array.from(merged.values());
      initialArchiveSnapshotLoaded = true;
      writeArchive(mergedArchive);
      if (JSON.stringify(localArchive) !== JSON.stringify(mergedArchive)) await pushArchiveToCloud(mergedArchive);
    } else {
      writeArchive(cloudArchive);
    }
    if (document.getElementById('monthlyModal')?.style.display === 'flex') window.loadSelectedMonthData();
    setSyncBadge('online');
  }, (error) => {
    console.error('archive snapshot error', error);
    setSyncBadge('offline');
    showAuthMessage(firebaseErrorMessage(error), true);
  });
}

function showAuthMessage(message, isError = false) {
  const el = document.getElementById('authMessage');
  if (el) {
    el.textContent = message || '';
    el.style.color = isError ? 'var(--danger)' : 'var(--success-dark)';
  }
}

function firebaseErrorMessage(error) {
  const code = error?.code || '';
  const messages = {
    'auth/invalid-email': 'صيغة البريد الإلكتروني غير صحيحة.',
    'auth/missing-password': 'يرجى إدخال كلمة المرور.',
    'auth/weak-password': 'كلمة المرور ضعيفة؛ استخدم 6 أحرف على الأقل.',
    'auth/email-already-in-use': 'هذا البريد مسجل مسبقاً. استخدم تسجيل الدخول.',
    'auth/invalid-credential': 'البريد الإلكتروني أو كلمة المرور غير صحيحة.',
    'auth/user-not-found': 'لا يوجد حساب بهذا البريد. أنشئ حساباً جديداً أولاً.',
    'auth/wrong-password': 'كلمة المرور غير صحيحة.',
    'auth/too-many-requests': 'محاولات كثيرة؛ انتظر قليلاً ثم حاول مجدداً.',
    'auth/network-request-failed': 'تعذر الاتصال بالإنترنت. تحقق من الشبكة.',
    'permission-denied': 'رفضت قواعد Firestore الوصول.',
    'unavailable': 'خدمة Firebase غير متاحة حالياً.'
  };
  return messages[code] || ('تعذر إكمال العملية: ' + (error?.message || code || 'خطأ غير معروف'));
}

function showHomeForUser(user) {
  currentUserUid = user.uid;
  const savedName = localStorage.getItem(USER_PREFIX + 'name') || user.displayName || 'حسان';
  const nameInput = document.getElementById('usernameInput');
  if (nameInput) nameInput.value = savedName;
  const userDisplay = document.getElementById('usernameDisplay');
  if (userDisplay) userDisplay.innerText = savedName;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('homeScreen').style.display = 'block';
  displayTodayHeaderInfo();
  loadTodayLocalItems();
  setSyncBadge('syncing');
  startCloudListener();
  startArchiveListener();
  showAuthMessage('تم تسجيل الدخول. جارٍ مزامنة بيانات حسابك…', false);
}

window.doLogin = async function() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if (!email || !password) { showAuthMessage('أدخل البريد الإلكتروني وكلمة المرور.', true); return; }
  const button = document.getElementById('loginButton');
  if (button) { button.disabled = true; button.textContent = 'جارٍ تسجيل الدخول…'; }
  try {
    await signInWithEmailAndPassword(auth, email, password);
    const nameInputVal = document.getElementById('usernameInput')?.value.trim() || 'حسان';
    localStorage.setItem(USER_PREFIX + 'name', nameInputVal);
    showAuthMessage('تم تسجيل الدخول بنجاح.', false);
  } catch (e) {
    console.error('sign in error', e);
    showAuthMessage(firebaseErrorMessage(e), true);
  } finally {
    if (button) { button.disabled = false; button.textContent = 'تسجيل الدخول'; }
  }
}

window.registerAccount = async function() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if (!email || !password) { showAuthMessage('أدخل البريد الإلكتروني وكلمة المرور لإنشاء حساب.', true); return; }
  try {
    await createUserWithEmailAndPassword(auth, email, password);
    showAuthMessage('تم إنشاء الحساب بنجاح!', false);
  } catch (e) {
    console.error('register error', e);
    showAuthMessage(firebaseErrorMessage(e), true);
  }
}

window.resetPassword = async function() {
  const email = document.getElementById('emailInput').value.trim();
  if (!email) { showAuthMessage('أدخل البريد الإلكتروني أولاً لاستعادة كلمة المرور.', true); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    showAuthMessage('تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني.', false);
  } catch (e) {
    console.error('reset error', e);
    showAuthMessage(firebaseErrorMessage(e), true);
  }
}

window.logout = async function() {
  try {
    if (unsubscribeSnapshot) unsubscribeSnapshot();
    if (unsubscribeArchiveSnapshot) unsubscribeArchiveSnapshot();
    await signOut(auth);
  } catch(e) {
    console.error('logout error', e);
  }
  currentUserUid = null;
  allItemsCache = [];
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  showAuthMessage('تم تسجيل الخروج بنجاح.', false);
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    showHomeForUser(user);
  } else {
    document.getElementById('homeScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }
});

function loadTodayLocalItems() {
  try {
    const data = localStorage.getItem(todayKey());
    if (data) allItemsCache = JSON.parse(data);
    else allItemsCache = [];
  } catch(e) { allItemsCache = []; }
  window.renderItemsList(allItemsCache);
}

function saveTodayLocalItems() {
  try { localStorage.setItem(todayKey(), JSON.stringify(allItemsCache)); } catch(e) {}
}

window.renderItemsList = function(list) {
  const container = document.getElementById('itemsList');
  if (!container) return;
  const searchTerm = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
  const filtered = list.filter(item => !searchTerm || (item.name && item.name.toLowerCase().includes(searchTerm)));

  let totalPrice = 0;
  let totalWeight = filtered.length;
  let doneCount = 0;
  let activeCount = 0;

  filtered.forEach(item => {
    const p = parseFloat(item.price) || 0;
    const w = parseFloat(item.weight) || 1;
    totalPrice += p * w;
    if (item.status === 'done') doneCount++;
    else activeCount++;
  });

  const priceEl = document.getElementById('totalPrice');
  if (priceEl) priceEl.innerText = totalPrice.toFixed(2);
  const weightEl = document.getElementById('totalWeight');
  if (weightEl) weightEl.innerText = totalWeight;
  const doneEl = document.getElementById('doneCount');
  if (doneEl) doneEl.innerText = doneCount;
  const activeEl = document.getElementById('activeCount');
  if (activeEl) activeEl.innerText = activeCount;

  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-light); background:var(--card); border-radius:18px; border:1px solid var(--border);">لا توجد مواد مسجلة لهذا اليوم. اضغط على زر "إضافة مادة جديدة" للبدء.</div>';
    return;
  }

  let html = '';
  filtered.forEach(item => {
    const p = parseFloat(item.price) || 0;
    const w = parseFloat(item.weight) || 1;
    const itemTotal = p * w;
    const isDone = item.status === 'done';

    html += `
      <div class="item-card" style="${isDone ? 'opacity:0.75; background:#FAFAFA;' : ''}">
        <div class="item-header">
          <div>
            <div class="item-name" style="${isDone ? 'text-decoration:line-through; color:var(--text-light);' : ''}">${escapeHtml(item.name)}</div>
            <div class="item-meta">
              <span class="item-badge">الكمية: ${w} ${escapeHtml(item.unit || 'كغ')}</span>
              <span class="item-badge">التاريخ: ${escapeHtml(item.formattedDate || '')}</span>
            </div>
          </div>
          <div class="item-total-badge">${itemTotal.toFixed(2)} $</div>
        </div>
        <div class="item-price-info">
          <span style="font-size:13px; color:var(--text-light);">سعر الوحدة: ${p.toFixed(2)} $</span>
        </div>
        <div class="item-actions">
          ${isDone 
            ? `<button class="action-btn cancel" onclick="updateItemStatus('${item.id}', 'active')">↩️ إلغاء الإنجاز</button>`
            : `<button class="action-btn done" onclick="updateItemStatus('${item.id}', 'done')">✅ تم الشراء</button>`
          }
          <button class="action-btn edit" onclick="openEditDailyItemModal('${item.id}')">✏️ تعديل</button>
          <button class="action-btn delete" onclick="deleteItem('${item.id}')">🗑️ حذف</button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

window.filterTodayItems = function() {
  window.renderItemsList(allItemsCache);
}

function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

window.openAddItemModal = function() {
  document.getElementById('itemNameInput').value = '';
  document.getElementById('itemPriceInput').value = '';
  document.getElementById('itemWeightInput').value = '1';
  document.getElementById('addItemModal').style.display = 'flex';
}
window.closeAddItemModal = function() {
  document.getElementById('addItemModal').style.display = 'none';
}

window.submitNewItem = async function() {
  const name = document.getElementById('itemNameInput').value.trim();
  const price = parseFloat(document.getElementById('itemPriceInput').value) || 0;
  const weight = parseFloat(document.getElementById('itemWeightInput').value) || 1;
  const unit = document.getElementById('itemUnitInput').value;

  if (!name) { alert('يرجى إدخال اسم المادة.'); return; }

  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const formattedDate = new Date().toLocaleDateString('ar-SY', options);

  const newItem = {
    id: 'item_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
    name,
    price,
    weight,
    unit,
    status: 'active',
    date: new Date().toISOString(),
    formattedDate
  };

  allItemsCache.unshift(newItem);
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
  closeAddItemModal();
  await pushItemToCloud(newItem);
}

window.updateItemStatus = async function(id, status) {
  const item = allItemsCache.find(i => i.id === id);
  if (item) {
    item.status = status;
    saveTodayLocalItems();
    window.renderItemsList(allItemsCache);
    await pushItemToCloud(item);
  }
}

window.deleteItem = async function(id) {
  if (!confirm('هل أنت متأكد من حذف هذه المادة؟')) return;
  allItemsCache = allItemsCache.filter(i => i.id !== id);
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
  await deleteItemFromCloud(id);
}

// تعديل مادة اليوم الحالية
window.openEditDailyItemModal = function(id) {
  const item = allItemsCache.find(i => i.id === id);
  if (!item) return;
  document.getElementById('editDailyItemId').value = item.id;
  document.getElementById('editDailyItemName').value = item.name || '';
  document.getElementById('editDailyItemPrice').value = item.price || 0;
  document.getElementById('editDailyItemWeight').value = item.weight || 1;
  document.getElementById('editDailyItemUnit').value = item.unit || 'كغ';
  document.getElementById('editDailyItemModal').style.display = 'flex';
}

window.closeEditDailyItemModal = function() {
  document.getElementById('editDailyItemModal').style.display = 'none';
}

window.saveEditedDailyItem = async function() {
  const id = document.getElementById('editDailyItemId').value;
  const item = allItemsCache.find(i => i.id === id);
  if (!item) return;

  item.name = document.getElementById('editDailyItemName').value.trim();
  item.price = parseFloat(document.getElementById('editDailyItemPrice').value) || 0;
  item.weight = parseFloat(document.getElementById('editDailyItemWeight').value) || 1;
  item.unit = document.getElementById('editDailyItemUnit').value;

  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
  closeEditDailyItemModal();
  await pushItemToCloud(item);
}

window.archiveCurrentDay = async function() {
  if (allItemsCache.length === 0) {
    alert('لا توجد مواد في قائمة اليوم لأرشفتها.');
    return;
  }
  if (!confirm('هل تريد أرشفة مواد اليوم وترحيلها إلى السجل الشهري وبدء يوم جديد؟')) return;

  const archive = readArchive();
  const todayStr = new Date().toLocaleDateString('ar-SY', { year: 'numeric', month: 'long', day: 'numeric' });

  allItemsCache.forEach(item => {
    archive.unshift({
      ...item,
      archId: 'arch_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
      archivedAtDate: todayStr
    });
  });

  writeArchive(archive);
  await pushArchiveToCloud(archive);

  for (const item of allItemsCache) {
    await deleteItemFromCloud(item.id);
  }
  allItemsCache = [];
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
  alert('تمت أرشفة اليوم بنجاح وترحيل البيانات إلى السجل الشهري.');
}

window.showMonthlyReport = function() {
  const now = new Date();
  document.getElementById('yearSelect').value = now.getFullYear();
  document.getElementById('monthSelect').value = now.getMonth() + 1;
  document.getElementById('monthlyModal').style.display = 'flex';
  window.loadSelectedMonthData();
}

window.closeMonthlyReport = function() {
  document.getElementById('monthlyModal').style.display = 'none';
}

window.loadSelectedMonthData = function() {
  const selectedYear = parseInt(document.getElementById('yearSelect').value);
  const selectedMonth = parseInt(document.getElementById('monthSelect').value);
  const archive = readArchive();

  const container = document.getElementById('monthlyContent');
  if (!container) return;

  const filtered = archive.filter(item => {
    const d = new Date(item.date || Date.now());
    return d.getFullYear() === selectedYear && (d.getMonth() + 1) === selectedMonth;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<p style="text-align: center; color: var(--text-light); padding: 20px;">لا توجد سجلات مؤرشفة لهذا الشهر.</p>';
    return;
  }

  const grouped = {};
  filtered.forEach(item => {
    const dayKey = item.archivedAtDate || item.formattedDate || 'تاريخ غير محدد';
    if (!grouped[dayKey]) grouped[dayKey] = [];
    grouped[dayKey].push(item);
  });

  let grandTotal = 0;
  let html = '';

  for (const [day, items] of Object.entries(grouped)) {
    let dayTotal = 0;
    let rowsHtml = '';
    items.forEach(item => {
      const t = (parseFloat(item.price) || 0) * (parseFloat(item.weight) || 1);
      dayTotal += t;
      grandTotal += t;
      rowsHtml += `
        <div class="day-row">
          <span><b>${escapeHtml(item.name)}</b> (${item.weight} ${item.unit || 'كغ'})</span>
          <div style="display:flex; align-items:center; gap:8px;">
            <span><b>${t.toFixed(2)} $</b></span>
            <div class="row-actions">
              <button class="mini-btn edit" onclick="openEditArchiveItemModal('${item.archId}')">تعديل</button>
            </div>
          </div>
        </div>
      `;
    });

    html += `
      <div class="day-group">
        <div class="day-group-header">
          <span>📅 ${escapeHtml(day)}</span>
          <span>إجمالي اليوم: ${dayTotal.toFixed(2)} $</span>
        </div>
        <div class="day-group-body">
          ${rowsHtml}
        </div>
      </div>
    `;
  }

  html += `
    <div class="month-grand-total">
      <span>إجمالي الشهر:</span>
      <span style="color:var(--primary-dark); font-size:17px;">${grandTotal.toFixed(2)} $</span>
    </div>
  `;

  container.innerHTML = html;
}

window.openEditArchiveItemModal = function(archId) {
  const archive = readArchive();
  const item = archive.find(i => i.archId === archId);
  if (!item) return;

  document.getElementById('editItemArchId').value = item.archId;
  document.getElementById('editItemName').value = item.name || '';
  document.getElementById('editItemPrice').value = item.price || 0;
  document.getElementById('editItemWeight').value = item.weight || 1;
  document.getElementById('editItemUnit').value = item.unit || 'كغ';
  document.getElementById('editItemModal').style.display = 'flex';
}

window.closeEditItemModal = function() {
  document.getElementById('editItemModal').style.display = 'none';
}

window.saveEditedArchiveItem = async function() {
  const archId = document.getElementById('editItemArchId').value;
  const archive = readArchive();
  const item = archive.find(i => i.archId === archId);
  if (!item) return;

  item.name = document.getElementById('editItemName').value.trim();
  item.price = parseFloat(document.getElementById('editItemPrice').value) || 0;
  item.weight = parseFloat(document.getElementById('editItemWeight').value) || 1;
  item.unit = document.getElementById('editItemUnit').value;

  writeArchive(archive);
  await pushArchiveToCloud(archive);
  closeEditItemModal();
  window.loadSelectedMonthData();
}

window.deleteArchiveItemFromModal = async function() {
  const archId = document.getElementById('editItemArchId').value;
  if (!confirm('هل تريد حذف هذه المادة من الأرشيف نهائياً؟')) return;

  let archive = readArchive();
  archive = archive.filter(i => i.archId !== archId);
  writeArchive(archive);
  await pushArchiveToCloud(archive);
  closeEditItemModal();
  window.loadSelectedMonthData();
}

window.downloadPDF = function() {
  const element = document.getElementById('monthlyReportPrintable');
  if (!element) return;
  const opt = {
    margin: 10,
    filename: 'baytna_monthly_report.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().from(element).set(opt).save();
}

let calcValue = '0';
let memoryValue = 0;

window.openCalculator = function() {
  document.getElementById('calculatorModal').style.display = 'flex';
  updateCalcScreen();
}
window.closeCalculator = function() {
  document.getElementById('calculatorModal').style.display = 'none';
}

window.pressCalc = function(char) {
  if (calcValue === '0' && !['+', '-', '*', '/', '.'].includes(char)) {
    calcValue = char;
  } else {
    calcValue += char;
  }
  updateCalcScreen();
}

window.clearCalc = function() {
  calcValue = '0';
  updateCalcScreen();
}

window.deleteCalcChar = function() {
  if (calcValue.length > 1) {
    calcValue = calcValue.slice(0, -1);
  } else {
    calcValue = '0';
  }
  updateCalcScreen();
}

window.calculateResult = function() {
  try {
    const sanitized = calcValue.replace(/×/g, '*').replace(/÷/g, '/');
    const result = eval(sanitized);
    calcValue = String(result);
  } catch(e) {
    calcValue = 'خطأ';
  }
  updateCalcScreen();
}

window.calcMemory = function(op) {
  try {
    const current = parseFloat(calcValue) || 0;
    if (op === 'MC') memoryValue = 0;
    else if (op === 'MR') { calcValue = String(memoryValue); }
    else if (op === 'M+') { memoryValue += current; }
  } catch(e) {}
  updateCalcScreen();
}

function updateCalcScreen() {
  const screen = document.getElementById('calcScreen');
  if (screen) screen.innerText = calcValue;
}

window.exportData = function() {
  const backup = {
    todayItems: allItemsCache,
    archive: readArchive(),
    exportDate: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'baytna_backup_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

window.importData = function(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.todayItems && Array.isArray(data.todayItems)) {
        allItemsCache = data.todayItems;
        saveTodayLocalItems();
        window.renderItemsList(allItemsCache);
        for (const item of allItemsCache) await pushItemToCloud(item);
      }
      if (data.archive && Array.isArray(data.archive)) {
        writeArchive(data.archive);
        await pushArchiveToCloud(data.archive);
      }
      alert('تم استيراد البيانات ومزامنتها بنجاح!');
    } catch(err) {
      alert('ملف النسخ الاحتياطي غير صالح.');
    }
  };
  reader.readAsText(file);
}
</script>
