<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6B9080">
<title>بيتنا</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F1EA; --card: #FFFFFF;
    --primary: #6B9080; --primary-dark: #4A6D5F;
    --accent: #C9A58D; --text: #2D3A3A; --text-light: #7A8787;
    --border: #EAE3D9; --danger: #B87B6E;
    --success: #7BA77E; --success-dark: #4A7C4E;
    --warning: #D4A55C;
    --shadow: 0 2px 12px rgba(45, 58, 58, 0.06);
    --shadow-lg: 0 8px 32px rgba(45, 58, 58, 0.12);
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }
  body { padding-bottom: 100px; }

  .login-wrap {
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px;
    background: linear-gradient(160deg, #F5F1EA 0%, #E8DFD2 100%);
  }
  .login-logo {
    width: 90px; height: 90px; border-radius: 28px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; margin-bottom: 24px;
    box-shadow: 0 12px 32px rgba(107, 144, 128, 0.3);
  }
  .login-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .login-sub { color: var(--text-light); font-size: 15px; margin-bottom: 40px; }
  .login-form { width: 100%; max-width: 360px; }
  .input-group { margin-bottom: 16px; }
  .input-label { font-size: 14px; color: var(--text-light); margin-bottom: 8px; display: block; font-weight: 500; }
  .input-field {
    width: 100%; padding: 16px 18px;
    border: 2px solid var(--border); border-radius: 16px;
    background: var(--card); font-size: 16px; font-family: inherit; color: var(--text);
  }

  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; font-size: 16px; font-weight: 600; font-family: inherit;
    cursor: pointer; box-shadow: 0 4px 16px rgba(107, 144, 128, 0.25);
  }

  .app-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245, 241, 234, 0.92);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-title span { color: var(--primary); }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer; box-shadow: var(--shadow);
  }
  .container { max-width: 560px; margin: 0 auto; padding: 16px 20px; }

  .summary-card {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; padding: 22px; border-radius: 22px;
    margin-bottom: 16px; box-shadow: 0 8px 24px rgba(107, 144, 128, 0.25);
  }
  .summary-row { display: flex; justify-content: space-between; align-items: center; }
  .summary-label { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
  .summary-value { font-size: 32px; font-weight: 700; }
  .summary-stats { display: flex; gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.2); }
  .summary-stat { flex: 1; }
  .summary-stat-label { font-size: 12px; opacity: 0.8; margin-bottom: 2px; }
  .summary-stat-value { font-size: 18px; font-weight: 700; }

  .action-main-btn {
    width: 100%; padding: 16px; margin-bottom: 12px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; font-family: inherit; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 18px rgba(107, 144, 128, 0.25);
  }

  .archive-day-btn {
    width: 100%; padding: 16px; margin-bottom: 12px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, #2D3A3A 0%, #1A2222 100%);
    color: white; font-family: inherit; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 18px rgba(45, 58, 58, 0.3);
  }

  .monthly-big-btn {
    width: 100%; padding: 16px; margin-bottom: 16px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%);
    color: white; font-family: inherit; font-size: 16px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 18px rgba(184, 123, 58, 0.3);
  }

  .today-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; margin-bottom: 12px;
    background: linear-gradient(135deg, #FFFFFF 0%, #F0EBE0 100%);
    border: 1px solid var(--border); border-radius: 14px;
    font-size: 14px; font-weight: 700; color: var(--primary-dark);
  }

  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-input {
    width: 100%; padding: 14px 44px 14px 18px;
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--card); font-size: 15px; font-family: inherit; color: var(--text);
  }

  .item-card {
    background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
  .item-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .item-meta { font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-badge { padding: 3px 8px; border-radius: 6px; background: #F0EBE0; font-size: 11px; color: var(--text-light); }
  .item-price-info { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; justify-content: space-between; }
  .item-price-badge { padding: 5px 10px; border-radius: 10px; background: #E8F5E9; color: #1B5E20; font-size: 13px; font-weight: 600; border: 1.5px solid #7BA77E; }
  .item-total-badge { padding: 5px 12px; border-radius: 10px; background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%); color: white; font-size: 14px; font-weight: 700; }

  .item-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .action-btn {
    padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .action-btn.edit { color: var(--primary-dark); border-color: var(--primary); }
  .action-btn.done { color: var(--success-dark); border-color: var(--success); }
  .action-btn.cancel { color: var(--warning); border-color: var(--warning); }
  .action-btn.delete { color: var(--danger); border-color: var(--danger); }

  .calc-fab {
    position: fixed; bottom: 24px; right: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #4A6D5F 0%, #2D3A3A 100%);
    color: white; border: none; font-size: 26px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(45, 58, 58, 0.35); z-index: 90;
  }

  .calculator-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
  .calc-screen {
    grid-column: span 4; background: #2D3A3A; color: #FFFFFF;
    font-size: 28px; font-weight: 700; text-align: left; padding: 18px; border-radius: 16px;
    min-height: 65px; display: flex; align-items: center; justify-content: flex-end; direction: ltr;
  }
  .calc-btn {
    padding: 16px; font-size: 20px; font-weight: 700; border-radius: 14px;
    border: 1.5px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
  }
  .calc-btn.op { background: #E8EEF2; color: var(--primary-dark); }
  .calc-btn.equal { background: var(--primary); color: white; border: none; }
  .calc-btn.clear { background: #FFF5F3; color: var(--danger); border-color: #F0D5CF; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(45, 58, 58, 0.5);
    backdrop-filter: blur(4px); z-index: 500; display: none; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 560px; max-height: 90vh; background: var(--bg);
    border-radius: 28px 28px 0 0; padding: 20px; overflow-y: auto;
  }
  .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .sheet-close { width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .month-picker-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .select-field { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); font-size: 14px; font-weight: 600; }
  .pdf-btn {
    width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #B87B6E 0%, #8A4238 100%); color: white; font-size: 15px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen" class="login-wrap">
  <div class="login-logo">🏠</div>
  <div class="login-title">بيتنا</div>
  <div class="login-sub">إدارة مخزون المنزل بذكاء</div>
  <div class="login-form">
    <div class="input-group">
      <label class="input-label">اسمك</label>
      <input type="text" id="usernameInput" class="input-field" value="حسان" autocomplete="off">
    </div>
    <button class="btn" type="button" onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- الشاشة الرئيسية -->
<div id="homeScreen" style="display: none;">
  <div class="app-header">
    <div class="header-title">بيت <span id="usernameDisplay">حسان</span> <span>🏠</span></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
      <button class="icon-btn" onclick="showMonthlyReport()" title="الأرشيف والسجل الشهري">📅</button>
      <button class="icon-btn" onclick="logout()" title="خروج">🚪</button>
    </div>
  </div>

  <div class="container">
    <div class="summary-card">
      <div class="summary-row">
        <div>
          <div class="summary-label">💰 إجمالي مشتريات اليوم</div>
          <div class="summary-value"><span id="totalPrice">0.00</span> <small>$</small></div>
        </div>
        <div style="font-size: 40px; opacity: 0.4;">🛒</div>
      </div>
      <div class="summary-stats">
        <div class="summary-stat">
          <div class="summary-stat-label">📦 عدد المواد اليوم</div>
          <div class="summary-stat-value"><span id="totalWeight">0</span> <small style="font-size:12px;">مادة</small></div>
        </div>
      </div>
    </div>

    <button class="action-main-btn" onclick="addNewItemPrompt()">➕ إضافة مادة جديدة لليوم</button>
    <button class="archive-day-btn" onclick="archiveCurrentDay()">📥 أرشفة ونهاية اليوم (ترحيل للسجل وبدء يوم جديد)</button>
    <button class="monthly-big-btn" onclick="showMonthlyReport()">📅 تصفح السجل الشهري والأرشيف وحفظ PDF</button>

    <div class="today-bar" id="currentDateBar">
      <span>📅 نشاط اليوم</span>
      <span id="dateDisplayString" style="color: var(--text-light); font-size: 12.5px;"></span>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث في مواد اليوم..." oninput="filterTodayItems()">
    </div>

    <div id="itemsList"></div>
  </div>

  <button class="calc-fab" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
</div>

<!-- نافذة الآلة الحاسبة -->
<div id="calculatorModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title">
      <span>🧮 الآلة الحاسبة</span>
      <button class="sheet-close" onclick="closeCalculator()">✕</button>
    </div>
    <div class="calculator-grid">
      <div class="calc-screen" id="calcScreen">0</div>
      <button class="calc-btn clear" onclick="clearCalc()">C</button>
      <button class="calc-btn op" onclick="pressCalc('/')">÷</button>
      <button class="calc-btn op" onclick="pressCalc('*')">×</button>
      <button class="calc-btn op" onclick="pressCalc('-')">-</button>

      <button class="calc-btn" onclick="pressCalc('7')">7</button>
      <button class="calc-btn" onclick="pressCalc('8')">8</button>
      <button class="calc-btn" onclick="pressCalc('9')">9</button>
      <button class="calc-btn op" onclick="pressCalc('+')">+</button>

      <button class="calc-btn" onclick="pressCalc('4')">4</button>
      <button class="calc-btn" onclick="pressCalc('5')">5</button>
      <button class="calc-btn" onclick="pressCalc('6')">6</button>
      <button class="calc-btn equal" onclick="calculateResult()" style="grid-row: span 2;">=</button>

      <button class="calc-btn" onclick="pressCalc('1')">1</button>
      <button class="calc-btn" onclick="pressCalc('2')">2</button>
      <button class="calc-btn" onclick="pressCalc('3')">3</button>

      <button class="calc-btn" onclick="pressCalc('0')" style="grid-column: span 2;">0</button>
      <button class="calc-btn" onclick="pressCalc('.')">.</button>
    </div>
  </div>
</div>

<!-- نافذة الأرشيف والسجل الشهري -->
<div id="monthlyModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title">
      <span>📅 الأرشيف والسجل الشهري وحفظ PDF</span>
      <button class="sheet-close" onclick="closeMonthlyReport()">✕</button>
    </div>

    <div class="month-picker-row">
      <select id="yearSelect" class="select-field" onchange="loadSelectedMonthData()">
        <option value="2026" selected>2026</option>
        <option value="2025">2025</option>
      </select>
      <select id="monthSelect" class="select-field" onchange="loadSelectedMonthData()">
        <option value="1">كانون الثاني (يناير)</option>
        <option value="2">شباط (فبراير)</option>
        <option value="3">آذار (مارس)</option>
        <option value="4">نيسان (أبريل)</option>
        <option value="5">أيار (مايو)</option>
        <option value="6">حزيران (يونيو)</option>
        <option value="7">تموز (يوليو)</option>
        <option value="8">آب (أغسطس)</option>
        <option value="9">أيلول (سبتمبر)</option>
        <option value="10" selected>تشرين الأول (أكتوبر)</option>
        <option value="11">تشرين الثاني (نوفمبر)</option>
        <option value="12">كانون الأول (ديسمبر)</option>
      </select>
    </div>

    <div id="monthlyReportPrintable">
      <div id="monthlyContent" style="background: var(--card); padding: 16px; border-radius: 16px; border: 1px solid var(--border);">
        <p style="text-align: center; color: var(--text-light);">جارِ جلب الأرشيف...</p>
      </div>
    </div>

    <button class="pdf-btn" onclick="downloadPDF()">📄 حفظ الأرشيف كملف PDF</button>
  </div>
</div>

<script>
let allItemsCache = [];

function displayTodayHeaderInfo() {
  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const todayStr = new Date().toLocaleDateString('ar-SY', options);
  const el = document.getElementById('dateDisplayString');
  if (el) el.innerText = todayStr;
}

window.doLogin = function() {
  const nameInput = document.getElementById('usernameInput');
  const name = nameInput ? nameInput.value.trim() : "حسان";
  localStorage.setItem('baytna_user', name);

  const userDisplay = document.getElementById('usernameDisplay');
  if (userDisplay) userDisplay.innerText = name;

  const loginScr = document.getElementById('loginScreen');
  const homeScr = document.getElementById('homeScreen');

  if (loginScr) loginScr.style.display = 'none';
  if (homeScr) homeScr.style.display = 'block';

  displayTodayHeaderInfo();
  loadTodayLocalItems();
};

window.logout = function() {
  localStorage.removeItem('baytna_user');
  const homeScr = document.getElementById('homeScreen');
  const loginScr = document.getElementById('loginScreen');
  if (homeScr) homeScr.style.display = 'none';
  if (loginScr) loginScr.style.display = 'flex';
};

function parseUnitChoice(choice) {
  if (!choice) return "كغ";
  const str = choice.toString().trim();
  if (str === "1" || str.includes("كغ")) return "كغ";
  if (str === "2" || str.includes("ليتر")) return "ليتر";
  if (str === "3" || str.includes("علب")) return "علبه";
  if (str === "4" || str.includes("ربط")) return "ربطة";
  if (str === "5" || str.includes("قطعة")) return "قطعة";
  return str || "كغ";
}

function loadTodayLocalItems() {
  const todayKey = 'baytna_items_' + new Date().toDateString();
  const saved = localStorage.getItem(todayKey);
  if (saved) {
    try {
      allItemsCache = JSON.parse(saved);
    } catch (e) {
      allItemsCache = [];
    }
  } else {
    allItemsCache = [];
  }
  window.renderItemsList(allItemsCache);
}

function saveTodayLocalItems() {
  const todayKey = 'baytna_items_' + new Date().toDateString();
  localStorage.setItem(todayKey, JSON.stringify(allItemsCache));
}

window.archiveCurrentDay = function() {
  if (allItemsCache.length === 0) {
    alert("لا توجد مواد مسجلة اليوم لأرشفتها!");
    return;
  }
  if (!confirm("هل أنت متأكد من أرشفة مشتريات اليوم وحفظها في السجل الشهري، وبدء صفحة يوم جديد؟")) return;

  const archiveKey = 'baytna_archive_list';
  let archive = [];
  try {
    archive = JSON.parse(localStorage.getItem(archiveKey) || '[]');
  } catch (e) { archive = []; }

  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const formattedDate = new Date().toLocaleDateString('ar-SY', options);

  allItemsCache.forEach(item => {
    archive.push({ ...item, archivedDate: formattedDate, timestamp: Date.now() });
  });

  localStorage.setItem(archiveKey, JSON.stringify(archive));

  const todayKey = 'baytna_items_' + new Date().toDateString();
  allItemsCache = [];
  localStorage.removeItem(todayKey);
  window.renderItemsList(allItemsCache);

  alert("تمت أرشفة اليوم بنجاح وأصبح لديك صفحة يوم جديد نظيفة!");
};

window.addNewItemPrompt = function() {
  const name = prompt("أدخل اسم المادة الجديدة:");
  if (!name || !name.trim()) return;

  const price = prompt("أدخل السعر ($):", "0");
  if (price === null) return;

  const weight = prompt("أدخل الكمية (الرقم):", "1");
  if (weight === null) return;

  const unitChoice = prompt("اختر وحدة القياس:\n1: كغ\n2: ليتر\n3: علبه\n4: ربطة\n5: قطعة", "1");
  if (unitChoice === null) return;

  const unit = parseUnitChoice(unitChoice);

  const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const formattedDate = new Date().toLocaleDateString('ar-SY', options);

  const newItem = {
    id: 'local_' + Date.now(),
    name: name.trim(),
    price: parseFloat(price) || 0,
    weight: parseFloat(weight) || 1,
    unit: unit,
    status: 'active',
    date: formattedDate,
    formattedDate: formattedDate
  };

  allItemsCache.unshift(newItem);
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
};

let calcExpression = "";
window.openCalculator = function() {
  const m = document.getElementById('calculatorModal');
  if (m) m.style.display = 'flex';
};
window.closeCalculator = function() {
  const m = document.getElementById('calculatorModal');
  if (m) m.style.display = 'none';
};
window.pressCalc = function(val) {
  calcExpression += val;
  const s = document.getElementById('calcScreen');
  if (s) s.innerText = calcExpression;
};
window.clearCalc = function() {
  calcExpression = "";
  const s = document.getElementById('calcScreen');
  if (s) s.innerText = "0";
};
window.calculateResult = function() {
  try {
    let res = eval(calcExpression);
    const s = document.getElementById('calcScreen');
    if (s) s.innerText = res;
    calcExpression = res.toString();
  } catch (e) {
    const s = document.getElementById('calcScreen');
    if (s) s.innerText = "خطأ";
    calcExpression = "";
  }
};

window.showMonthlyReport = function() {
  const m = document.getElementById('monthlyModal');
  if (m) m.style.display = 'flex';
  loadSelectedMonthData();
};
window.closeMonthlyReport = function() {
  const m = document.getElementById('monthlyModal');
  if (m) m.style.display = 'none';
};

window.renderItemsList = function(items) {
  const listContainer = document.getElementById('itemsList');
  if (!listContainer) return;
  let html = "";
  let totalP = 0;
  let activeItemsCount = 0;

  items.sort((a, b) => {
    const statusA = a.status || 'active';
    const statusB = b.status || 'active';
    if (statusA === 'active' && statusB !== 'active') return -1;
    if (statusA !== 'active' && statusB === 'active') return 1;
    return 0;
  });

  items.forEach((data) => {
    const p = parseFloat(data.price) || 0;
    const w = parseFloat(data.weight) || 1;
    const u = data.unit || 'كغ';
    const status = data.status || 'active';
    const sub = p * w;

    if (status === 'active') {
      totalP += sub;
      activeItemsCount += 1;
    }

    let statusBadge = "";
    let cardStyle = "";
    if (status === 'done') {
      statusBadge = ' <span style="color:var(--success-dark); font-size:12px; font-weight:700;">(✓ تم شراؤه)</span>';
      cardStyle = 'opacity: 0.75; background: #F3F8F2;';
    } else if (status === 'cancelled') {
      statusBadge = ' <span style="color:var(--danger); font-size:12px; font-weight:700; text-decoration: line-through;">(✕ ملغى)</span>';
      cardStyle = 'opacity: 0.6; background: #FBF5F3;';
    }

    html += `
      <div class="item-card" style="${cardStyle}">
        <div class="item-header">
          <div>
            <div class="item-name">${data.name}${statusBadge}</div>
            <div class="item-meta">
              <span>${data.formattedDate || data.date || ''}</span>
              <span class="item-badge">${u}</span>
            </div>
          </div>
        </div>
        <div class="item-price-info">
          <span class="item-price-badge">${p.toFixed(2)} $ × ${w} ${u}</span>
          <span class="item-total-badge">${sub.toFixed(2)} $</span>
        </div>
        <div class="item-actions">
          <button class="action-btn edit" onclick="editItem('${data.id}')">تعديل</button>
          <button class="action-btn done" onclick="markItemDone('${data.id}')">تم الشراء</button>
          <button class="action-btn cancel" onclick="cancelItem('${data.id}')">إلغاء</button>
          <button class="action-btn delete" onclick="deleteItem('${data.id}')">حذف</button>
        </div>
      </div>
    `;
  });

  listContainer.innerHTML = html || '<p style="text-align:center;color:var(--text-light);padding:40px 0;">لا توجد مواد اليوم بعد. أضف مادة جديدة للبدء.</p>';

  const totalEl = document.getElementById('totalPrice');
  const weightEl = document.getElementById('totalWeight');
  if (totalEl) totalEl.innerText = totalP.toFixed(2);
  if (weightEl) weightEl.innerText = activeItemsCount;
};

window.filterTodayItems = function() {
  const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  if (!q) return window.renderItemsList(allItemsCache);
  const filtered = allItemsCache.filter(it => (it.name || '').toLowerCase().includes(q));
  window.renderItemsList(filtered);
};

window.editItem = function(id) {
  const item = allItemsCache.find(i => i.id === id);
  if (!item) return;
  const name = prompt("اسم المادة:", item.name);
  if (name === null) return;
  const price = prompt("السعر ($):", item.price);
  if (price === null) return;
  const weight = prompt("الكمية:", item.weight);
  if (weight === null) return;
  item.name = name.trim() || item.name;
  item.price = parseFloat(price) || 0;
  item.weight = parseFloat(weight) || 1;
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
};

window.markItemDone = function(id) {
  const item = allItemsCache.find(i => i.id === id);
  if (!item) return;
  item.status = 'done';
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
};

window.cancelItem = function(id) {
  const item = allItemsCache.find(i => i.id === id);
  if (!item) return;
  item.status = 'cancelled';
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
};

window.deleteItem = function(id) {
  if (!confirm("هل تريد حذف هذه المادة نهائياً؟")) return;
  allItemsCache = allItemsCache.filter(i => i.id !== id);
  saveTodayLocalItems();
  window.renderItemsList(allItemsCache);
};

window.loadSelectedMonthData = function() {
  const year = parseInt(document.getElementById('yearSelect')?.value || '2026');
  const month = parseInt(document.getElementById('monthSelect')?.value || '10');
  const container = document.getElementById('monthlyContent');
  if (!container) return;

  let archive = [];
  try { archive = JSON.parse(localStorage.getItem('baytna_archive_list') || '[]'); } catch (e) {}

  const monthItems = archive.filter(it => {
    const t = it.timestamp ? new Date(it.timestamp) : null;
    return t && t.getFullYear() === year && (t.getMonth() + 1) === month;
  });

  if (monthItems.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:var(--text-light);padding:30px 0;">لا توجد بيانات مؤرشفة لهذا الشهر.</p>';
    return;
  }

  let total = 0;
  let rows = "";
  monthItems.forEach(it => {
    const sub = (parseFloat(it.price) || 0) * (parseFloat(it.weight) || 1);
    total += sub;
    rows += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;">
      <span>${it.name} (${it.weight} ${it.unit || 'كغ'})</span>
      <span style="font-weight:700;">${sub.toFixed(2)} $</span>
    </div>`;
  });

  container.innerHTML = `
    <div style="font-size:15px;font-weight:700;margin-bottom:10px;color:var(--primary-dark);">
      سجل ${month}/${year} — ${monthItems.length} مادة
    </div>
    ${rows}
    <div style="display:flex;justify-content:space-between;margin-top:14px;padding-top:10px;border-top:2px solid var(--primary);font-weight:700;">
      <span>الإجمالي</span><span>${total.toFixed(2)} $</span>
    </div>
  `;
};

window.downloadPDF = function() {
  const el = document.getElementById('monthlyReportPrintable');
  if (!el || typeof html2pdf === 'undefined') return;
  html2pdf().set({
    margin: 10,
    filename: 'baytna_report.pdf',
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(el).save();
};

// استعادة الجلسة تلقائياً إن وُجد مستخدم محفوظ
(function restoreSession() {
  const saved = localStorage.getItem('baytna_user');
  if (saved) {
    const nameInput = document.getElementById('usernameInput');
    if (nameInput) nameInput.value = saved;
    window.doLogin();
  } else {
    displayTodayHeaderInfo();
  }
})();
</script>
</body>
</html>
