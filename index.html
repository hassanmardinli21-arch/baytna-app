<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6B9080">
<title>بيتنا</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F1EA; --card: #FFFFFF;
    --primary: #6B9080; --primary-dark: #4A6D5F;
    --accent: #C9A58D; --text: #2D3A3A; --text-light: #7A8787;
    --border: #EAE3D9; --danger: #B87B6E;
    --success: #7BA77E; --success-dark: #4A7C4E;
    --warning: #D4A55C;
    --shadow: 0 2px 12px rgba(45, 58, 58, 0.06);
    --shadow-lg: 0 8px 32px rgba(45, 58, 58, 0.12);
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }
  body { padding-bottom: 100px; }

  .login-wrap {
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center; padding: 24px;
    background: linear-gradient(160deg, #F5F1EA 0%, #E8DFD2 100%);
  }
  .login-logo {
    width: 90px; height: 90px; border-radius: 28px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; margin-bottom: 24px;
    box-shadow: 0 12px 32px rgba(107, 144, 128, 0.3);
  }
  .login-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .login-sub { color: var(--text-light); font-size: 15px; margin-bottom: 40px; }
  .login-form { width: 100%; max-width: 360px; }
  .input-group { margin-bottom: 16px; }
  .input-label { font-size: 14px; color: var(--text-light); margin-bottom: 8px; display: block; font-weight: 500; }
  .input-field {
    width: 100%; padding: 16px 18px;
    border: 2px solid var(--border); border-radius: 16px;
    background: var(--card); font-size: 16px; font-family: inherit; color: var(--text);
    transition: all 0.2s;
  }

  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; font-size: 16px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(107, 144, 128, 0.25);
  }

  .hidden { display: none !important; }
  .app-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245, 241, 234, 0.92);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-title span { color: var(--primary); }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer; position: relative;
    box-shadow: var(--shadow); transition: all 0.2s;
  }
  .container { max-width: 560px; margin: 0 auto; padding: 16px 20px; }

  .summary-card {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; padding: 22px; border-radius: 22px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(107, 144, 128, 0.25);
  }
  .summary-row { display: flex; justify-content: space-between; align-items: center; }
  .summary-label { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
  .summary-value { font-size: 32px; font-weight: 700; }
  .summary-value small { font-size: 16px; font-weight: 500; opacity: 0.9; }
  .summary-stats { display: flex; gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.2); }
  .summary-stat { flex: 1; }
  .summary-stat-label { font-size: 12px; opacity: 0.8; margin-bottom: 2px; }
  .summary-stat-value { font-size: 18px; font-weight: 700; }

  .monthly-big-btn {
    width: 100%; padding: 16px; margin-bottom: 16px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%);
    color: white; font-family: inherit;
    font-size: 16px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 18px rgba(184, 123, 58, 0.3);
  }

  .extra-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .extra-btn {
    padding: 14px; border-radius: 14px; font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; border: none;
  }
  .extra-btn.archive-btn { background: #E8EEF2; color: #4A6D5F; border: 2px dashed #4A6D5F; }
  .extra-btn.missing-btn { background: #FFF3D6; color: #8B6914; border: 2px dashed #D4A55C; }
  .extra-btn.tools-btn { grid-column: 1 / -1; background: #F5E0DC; color: #8A4238; border: 2px dashed #B87B6E; }

  .end-day-btn {
    width: 100%; padding: 14px; margin-bottom: 16px;
    border: 2px dashed #B87B6E; border-radius: 14px;
    background: #FFF5F3; color: #8A4238; font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  .today-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; margin-bottom: 12px;
    background: linear-gradient(135deg, #FFFFFF 0%, #F0EBE0 100%);
    border: 1px solid var(--border); border-radius: 14px;
    font-size: 13.5px; font-weight: 700; color: var(--primary-dark);
  }

  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-input {
    width: 100%; padding: 14px 44px 14px 18px;
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--card); font-size: 15px; font-family: inherit; color: var(--text);
  }

  .fab {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    padding: 16px 32px; border-radius: 999px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; border: none; font-family: inherit;
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 24px rgba(107, 144, 128, 0.35);
    display: flex; align-items: center; gap: 8px; z-index: 50;
  }

  .calc-fab {
    position: fixed; bottom: 24px; right: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #4A6D5F 0%, #2D3A3A 100%);
    color: white; border: none; font-size: 26px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(45, 58, 58, 0.35); z-index: 90;
  }

  .calculator-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
  .calc-screen {
    grid-column: span 4; background: #2D3A3A; color: #FFFFFF;
    font-size: 28px; font-weight: 700; text-align: left; padding: 18px; border-radius: 16px;
    min-height: 65px; word-break: break-all; display: flex; align-items: center; justify-content: flex-end; direction: ltr;
  }
  .calc-btn {
    padding: 16px; font-size: 20px; font-weight: 700; border-radius: 14px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
  }
  .calc-btn.op { background: #E8EEF2; color: var(--primary-dark); }
  .calc-btn.equal { background: var(--primary); color: white; border: none; }
  .calc-btn.clear { background: #FFF5F3; color: var(--danger); border-color: #F0D5CF; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(45, 58, 58, 0.5);
    backdrop-filter: blur(4px); z-index: 500; display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 560px; max-height: 90vh; background: var(--bg);
    border-radius: 28px 28px 0 0; padding: 20px; overflow-y: auto;
  }
  .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .sheet-close { width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .month-picker-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .select-field { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); font-size: 14px; font-weight: 600; }
  .pdf-btn {
    width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #B87B6E 0%, #8A4238 100%); color: white; font-size: 15px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-logo">🏠</div>
  <div class="login-title">بيتنا</div>
  <div class="login-sub">إدارة مخزون المنزل بذكاء</div>
  <div class="login-form">
    <div class="input-group">
      <label class="input-label">اسمك</label>
      <input type="text" id="usernameInput" class="input-field" placeholder="مثال: حسن" autocomplete="off">
    </div>
    <button class="btn" onclick="login()">دخول</button>
  </div>
</div>

<div id="homeScreen" class="hidden">
  <div class="app-header">
    <div class="header-title">بيت <span id="usernameDisplay"></span> <span>🏠</span></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
      <button class="icon-btn" onclick="showMonthlyReport()" title="الشهور الماضية">📅</button>
      <button class="icon-btn" onclick="logout()" title="خروج">🚪</button>
    </div>
  </div>

  <div class="container">
    <div class="summary-card">
      <div class="summary-row">
        <div>
          <div class="summary-label">💰 إجمالي مشتريات اليوم</div>
          <div class="summary-value"><span id="totalPrice">0.00</span> <small>$</small></div>
        </div>
        <div style="font-size: 40px; opacity: 0.4;">🛒</div>
      </div>
      <div class="summary-stats">
        <div class="summary-stat">
          <div class="summary-stat-label">📦 إجمالي الوزن</div>
          <div class="summary-stat-value"><span id="totalWeight">0</span> <small style="font-size:12px;">كغ</small></div>
        </div>
      </div>
      <div class="summary-stats">
        <div class="summary-stat">
          <div class="summary-stat-label">🛒 نشطة</div>
          <div class="summary-stat-value" id="totalItems">0</div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">✅ تم شراؤها</div>
          <div class="summary-stat-value" id="doneItems">0</div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">⏸️ ملغاة</div>
          <div class="summary-stat-value" id="cancelledItems">0</div>
        </div>
      </div>
    </div>

    <button class="monthly-big-btn" onclick="showMonthlyReport()">📅 تصفح الشهور الماضية وحفظ PDF</button>

    <div class="today-bar" id="todayBar"></div>

    <div class="extra-btns">
      <button class="extra-btn archive-btn" onclick="showArchive()">
        📂 الأرشيف <span id="archiveCount" style="opacity:0.7;"></span>
      </button>
      <button class="extra-btn missing-btn" onclick="showMissingData()">
        ⚠️ ناقصة <span id="missingCount" style="opacity:0.7;"></span>
      </button>
      <button class="extra-btn tools-btn" onclick="showDiagnostics()">
        🔧 أداة التشخيص والإصلاح
      </button>
    </div>

    <button class="end-day-btn" id="endDayBtn" onclick="endDay()">
      📦 إغلاق اليوم (أرشفة مواد اليوم السابقة)
    </button>

    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن مادة..." oninput="renderItems()">
    </div>

    <div id="itemsList"></div>
  </div>

  <button class="fab" onclick="openItemSheet()">＋ إضافة مادة</button>
  <button class="calc-fab" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
</div>

<!-- نافذة الآلة الحاسبة -->
<div id="calculatorModal" class="modal-overlay hidden">
  <div class="sheet">
    <div class="sheet-title">
      <span>🧮 الآلة الحاسبة</span>
      <button class="sheet-close" onclick="closeCalculator()">✕</button>
    </div>
    <div class="calculator-grid">
      <div class="calc-screen" id="calcScreen">0</div>
      <button class="calc-btn clear" onclick="clearCalc()">C</button>
      <button class="calc-btn op" onclick="pressCalc('/')">÷</button>
      <button class="calc-btn op" onclick="pressCalc('*')">×</button>
      <button class="calc-btn op" onclick="pressCalc('-')">-</button>
      
      <button class="calc-btn" onclick="pressCalc('7')">7</button>
      <button class="calc-btn" onclick="pressCalc('8')">8</button>
      <button class="calc-btn" onclick="pressCalc('9')">9</button>
      <button class="calc-btn op" onclick="pressCalc('+')">+</button>
      
      <button class="calc-btn" onclick="pressCalc('4')">4</button>
      <button class="calc-btn" onclick="pressCalc('5')">5</button>
      <button class="calc-btn" onclick="pressCalc('6')">6</button>
      <button class="calc-btn equal" onclick="calculateResult()" style="grid-row: span 2;">=</button>
      
      <button class="calc-btn" onclick="pressCalc('1')">1</button>
      <button class="calc-btn" onclick="pressCalc('2')">2</button>
      <button class="calc-btn" onclick="pressCalc('3')">3</button>
      
      <button class="calc-btn" onclick="pressCalc('0')" style="grid-column: span 2;">0</button>
      <button class="calc-btn" onclick="pressCalc('.')">.</button>
    </div>
  </div>
</div>

<!-- نافذة عرض الشهور الماضية وحفظ PDF -->
<div id="monthlyModal" class="modal-overlay hidden">
  <div class="sheet">
    <div class="sheet-title">
      <span>📅 تصفح الشهور الماضية وحفظ PDF</span>
      <button class="sheet-close" onclick="closeMonthlyReport()">✕</button>
    </div>
    
    <div class="month-picker-row">
      <select id="monthSelect" class="select-field" onchange="loadSelectedMonthData()">
        <option value="1">كانون الثاني (يناير)</option>
        <option value="2">شباط (فبراير)</option>
        <option value="3">آذار (مارس)</option>
        <option value="4">نيسان (أبريل)</option>
        <option value="5">أيار (مايو)</option>
        <option value="6">حزيران (يونيو)</option>
        <option value="7">تموز (يوليو)</option>
        <option value="8">آب (أغسطس)</option>
        <option value="9">أيلول (سبتمبر)</option>
        <option value="10">تشرين الأول (أكتوبر)</option>
        <option value="11">تشرين الثاني (نوفمبر)</option>
        <option value="12">كانون الأول (ديسمبر)</option>
      </select>
      <select id="yearSelect" class="select-field" onchange="loadSelectedMonthData()">
        <option value="2026">2026</option>
        <option value="2025">2025</option>
      </select>
    </div>

    <div id="monthlyReportPrintable">
      <div id="monthlyContent" style="background: var(--card); padding: 16px; border-radius: 16px; border: 1px solid var(--border);">
        <p style="text-align: center; color: var(--text-light);">جارِ جلب بيانات الشهر...</p>
      </div>
    </div>

    <button class="pdf-btn" onclick="downloadPDF()">📄 حفظ التقرير كملف PDF</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGET1u-j9p7TCkAXmZJWdjp0HLNszVC9Q",
  authDomain: "baytna-e0a77.firebaseapp.com",
  projectId: "baytna-e0a77",
  storageBucket: "baytna-e0a77.firebasestorage.app",
  messagingSenderId: "807987531508",
  appId: "1:807987531508:android:3f5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.login = function() {
  const name = document.getElementById('usernameInput').value.trim();
  if(name) {
    localStorage.setItem('baytna_user', name);
    document.getElementById('usernameDisplay').innerText = name;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('homeScreen').classList.remove('hidden');
  }
};

window.logout = function() {
  localStorage.removeItem('baytna_user');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('homeScreen').classList.add('hidden');
};

let calcExpression = "";
window.openCalculator = () => document.getElementById('calculatorModal').classList.remove('hidden');
window.closeCalculator = () => document.getElementById('calculatorModal').classList.add('hidden');
window.pressCalc = (val) => { calcExpression += val; document.getElementById('calcScreen').innerText = calcExpression; };
window.clearCalc = () => { calcExpression = ""; document.getElementById('calcScreen').innerText = "0"; };
window.calculateResult = () => {
  try {
    let res = eval(calcExpression);
    document.getElementById('calcScreen').innerText = res;
    calcExpression = res.toString();
  } catch(e) {
    document.getElementById('calcScreen').innerText = "خطأ";
    calcExpression = "";
  }
};

window.showMonthlyReport = () => {
  document.getElementById('monthlyModal').classList.remove('hidden');
  const now = new Date();
  document.getElementById('monthSelect').value = (now.getMonth() + 1).toString();
  document.getElementById('yearSelect').value = now.getFullYear().toString();
  window.loadSelectedMonthData();
};

window.closeMonthlyReport = () => document.getElementById('monthlyModal').classList.add('hidden');

// دالة جلب وعرض بيانات الشهر المختار من قاعدة البيانات
window.loadSelectedMonthData = async () => {
  const monthSelect = document.getElementById('monthSelect');
  const monthName = monthSelect.options[monthSelect.selectedIndex].text;
  const targetMonth = parseInt(monthSelect.value);
  const targetYear = parseInt(document.getElementById('yearSelect').value);
  const container = document.getElementById('monthlyContent');

  container.innerHTML = `<p style="text-align: center; color: var(--text-light); padding: 10px;">جارِ تحميل السجلات...</p>`;

  try {
    const querySnapshot = await getDocs(collection(db, "items"));
    let totalMonthPrice = 0;
    let itemsHtml = "";

    querySnapshot.forEach((docSnap) => {
      const data = docSnap.data();
      if (data.date) {
        const itemDate = new Date(data.date);
        if (itemDate.getMonth() + 1 === targetMonth && itemDate.getFullYear() === targetYear) {
          const itemTotal = (parseFloat(data.price) || 0) * (parseFloat(data.weight) || 1);
          totalMonthPrice += itemTotal;
          itemsHtml += `
            <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #F5F1EA; font-size: 13px;">
              <span>${data.name || 'مادة'}</span>
              <b style="color: #B87B3A;">${itemTotal.toFixed(2)} $</b>
            </div>
          `;
        }
      }
    });

    container.innerHTML = `
      <div style="background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%); color: white; padding: 16px; border-radius: 14px; text-align: center; margin-bottom: 12px;">
        <div style="font-size: 13px; opacity: 0.9;">تقرير شهر ${monthName} ${targetYear}</div>
        <div style="font-size: 24px; font-weight: 700; margin-top: 4px;">${totalMonthPrice.toFixed(2)} $</div>
      </div>
      <div style="max-height: 200px; overflow-y: auto;">
        ${itemsHtml || '<p style="text-align: center; color: var(--text-light); font-size: 13px; padding: 10px;">لا توجد مشتريات مسجلة في هذا الشهر.</p>'}
      </div>
    `;
  } catch (err) {
    container.innerHTML = `<p style="text-align: center; color: var(--danger); font-size: 13px; padding: 10px;">خطأ في جلب البيانات من السحابة.</p>`;
  }
};

window.downloadPDF = () => {
  const monthSelect = document.getElementById('monthSelect');
  const monthName = monthSelect.options[monthSelect.selectedIndex].text;
  const year = document.getElementById('yearSelect').value;
  const element = document.getElementById('monthlyReportPrintable');
  html2pdf().set({
    margin: 10, filename: `تقرير_بيتنا_${monthName}_${year}.pdf`,
    image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(element).save();
};

const savedUser = localStorage.getItem('baytna_user');
if(savedUser) {
  document.getElementById('usernameDisplay').innerText = savedUser;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('homeScreen').classList.remove('hidden');
}
</script>
</body>
</html>
