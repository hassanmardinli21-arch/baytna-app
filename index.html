<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6B9080">
<title>بيتنا</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F1EA; --card: #FFFFFF;
    --primary: #6B9080; --primary-dark: #4A6D5F;
    --accent: #C9A58D; --text: #2D3A3A; --text-light: #7A8787;
    --border: #EAE3D9; --danger: #B87B6E;
    --success: #7BA77E; --success-dark: #4A7C4E;
    --warning: #D4A55C;
    --shadow: 0 2px 12px rgba(45, 58, 58, 0.06);
    --shadow-lg: 0 12px 40px rgba(45, 58, 58, 0.18);
  }
  html, body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body { padding-bottom: 100px; }
  .login-wrap { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; background: linear-gradient(160deg, #F5F1EA 0%, #E8DFD2 100%); }
  .login-logo { width: 90px; height: 90px; border-radius: 28px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); display: flex; align-items: center; justify-content: center; font-size: 44px; margin-bottom: 24px; box-shadow: 0 12px 32px rgba(107, 144, 128, 0.3); }
  .login-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .login-sub { color: var(--text-light); font-size: 15px; margin-bottom: 40px; }
  .login-form { width: 100%; max-width: 360px; }
  .input-group { margin-bottom: 16px; }
  .input-label { font-size: 14px; color: var(--text-light); margin-bottom: 8px; display: block; font-weight: 500; }
  .input-field { width: 100%; padding: 16px 18px; border: 2px solid var(--border); border-radius: 16px; background: var(--card); font-size: 16px; font-family: inherit; color: var(--text); }
  .btn { width: 100%; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; box-shadow: 0 4px 16px rgba(107, 144, 128, 0.25); }
  .app-header { position: sticky; top: 0; z-index: 100; background: rgba(245, 241, 234, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-title span { color: var(--primary); }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn { width: 42px; height: 42px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: var(--shadow); }
  .sync-badge { font-size: 11px; padding: 4px 8px; border-radius: 8px; font-weight: 700; }
  .sync-badge.online { background: #E8F5E9; color: #2E7D32; }
  .sync-badge.offline { background: #FFF3E0; color: #E65100; }
  .sync-badge.syncing { background: #E3F2FD; color: #1565C0; }
  .container { max-width: 560px; margin: 0 auto; padding: 16px 20px; }
  .summary-card { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 22px; border-radius: 22px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(107, 144, 128, 0.25); }
  .summary-row { display: flex; justify-content: space-between; align-items: center; }
  .summary-label { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
  .summary-value { font-size: 32px; font-weight: 700; }
  .summary-stats { display: flex; gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.2); }
  .summary-stat { flex: 1; }
  .summary-stat-label { font-size: 12px; opacity: 0.8; margin-bottom: 2px; }
  .summary-stat-value { font-size: 18px; font-weight: 700; }
  .action-main-btn { width: 100%; padding: 16px; margin-bottom: 12px; border: none; border-radius: 16px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 18px rgba(107, 144, 128, 0.25); }
  .archive-day-btn { width: 100%; padding: 16px; margin-bottom: 12px; border: none; border-radius: 16px; background: linear-gradient(135deg, #2D3A3A 0%, #1A2222 100%); color: white; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 18px rgba(45, 58, 58, 0.3); }
  .monthly-big-btn { width: 100%; padding: 16px; margin-bottom: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%); color: white; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 18px rgba(184, 123, 58, 0.3); }
  .today-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; margin-bottom: 12px; background: linear-gradient(135deg, #FFFFFF 0%, #F0EBE0 100%); border: 1px solid var(--border); border-radius: 14px; font-size: 14px; font-weight: 700; color: var(--primary-dark); }
  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-input { width: 100%; padding: 14px 44px 14px 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); font-size: 15px; font-family: inherit; color: var(--text); }
  .item-card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); transition: all 0.3s ease; }
  .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
  .item-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .item-meta { font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-badge { padding: 3px 8px; border-radius: 6px; background: #F0EBE0; font-size: 11px; color: var(--text-light); }
  .item-price-info { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; align-items: center; justify-content: space-between; }
  .item-total-badge { padding: 5px 12px; border-radius: 10px; background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%); color: white; font-size: 14px; font-weight: 700; }
  .item-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .action-btn { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .action-btn.edit { color: var(--primary-dark); border-color: var(--primary); }
  .action-btn.done { color: var(--success-dark); border-color: var(--success); }
  .action-btn.cancel { color: var(--warning); border-color: var(--warning); }
  .action-btn.delete { color: var(--danger); border-color: var(--danger); }
  .calc-fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #4A6D5F 0%, #2D3A3A 100%); color: white; border: none; font-size: 26px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(45, 58, 58, 0.35); z-index: 90; }
  .calculator-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
  .calc-screen { grid-column: span 4; background: #2D3A3A; color: #FFFFFF; font-size: 28px; font-weight: 700; text-align: left; padding: 18px; border-radius: 16px; min-height: 65px; display: flex; align-items: center; justify-content: flex-end; direction: ltr; }
  .calc-btn { padding: 14px; font-size: 18px; font-weight: 700; border-radius: 14px; border: 1.5px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .calc-btn.op { background: #E8EEF2; color: var(--primary-dark); }
  .calc-btn.equal { background: var(--primary); color: white; border: none; grid-row: span 2; }
  .calc-btn.clear { background: #FFF5F3; color: var(--danger); border-color: #F0D5CF; }
  .calc-btn.mem { background: #F0EBE0; color: var(--text); font-size: 14px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(45, 58, 58, 0.5); backdrop-filter: blur(4px); z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px; }
  .sheet { width: 100%; max-width: 480px; background: var(--bg); border-radius: 24px; padding: 24px; overflow-y: auto; max-height: 90vh; box-shadow: var(--shadow-lg); }
  .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  .sheet-close { width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .month-picker-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .select-field { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); font-size: 14px; font-weight: 600; }
  .pdf-btn { width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: 14px; background: linear-gradient(135deg, #B87B6E 0%, #8A4238 100%); color: white; font-size: 15px; font-weight: 700; cursor: pointer; }
  .form-row { display: flex; gap: 12px; margin-bottom: 16px; }
  .form-group { flex: 1; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; }
  .form-control { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 15px; font-family: inherit; outline: none; }
  .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(107, 144, 128, 0.1); }
  .btn-submit { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--primary); color: white; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
  .btn-danger { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--danger); background: #FFF5F3; color: var(--danger); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .day-group { margin-bottom: 14px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .day-group-header { background: #F0EBE0; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: var(--primary-dark); gap: 8px; flex-wrap: wrap; }
  .day-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 6px; }
  .day-row:last-child { border-bottom: none; }
  .row-actions { display: flex; gap: 4px; }
  .mini-btn { padding: 4px 9px; border-radius: 7px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  .mini-btn.del { color: var(--danger); border-color: #E5C2BB; }
  .mini-btn.move { color: var(--primary-dark); border-color: var(--primary); }
  .mini-btn.edit { color: var(--warning); border-color: #E8CFA0; }
  .day-group-body { padding: 6px 12px; }
  .month-grand-total { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 10px; border-top: 2px solid var(--primary); font-weight: 700; font-size: 15px; }
  .backup-actions { display: flex; gap: 10px; margin-top: 16px; }
  .backup-actions .btn { flex: 1; padding: 12px; font-size: 14px; background: var(--card); color: var(--primary-dark); border: 1px solid var(--primary); box-shadow: none; }
  .backup-actions input[type="file"] { display: none; }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen" class="login-wrap">
  <div class="login-logo">🏠</div>
  <div class="login-title">بيتنا</div>
  <div class="login-sub">إدارة مخزون المنزل بذكاء</div>
  <div class="login-form">
    <div class="input-group">
      <label class="input-label">البريد الإلكتروني</label>
      <input type="email" id="emailInput" class="input-field" value="hassanmardinli21@gmail.com" autocomplete="username" dir="ltr" required>
    </div>
    <div class="input-group">
      <label class="input-label">كلمة المرور</label>
      <input type="password" id="passwordInput" class="input-field" placeholder="أدخل كلمة المرور" autocomplete="current-password" dir="ltr" required>
    </div>
    <div class="input-group">
      <label class="input-label">الاسم الظاهر (اختياري)</label>
      <input type="text" id="usernameInput" class="input-field" value="حسان" autocomplete="name">
    </div>
    <button class="btn" type="button" id="loginButton" onclick="doLogin()">تسجيل الدخول</button>
    <button class="btn" type="button" style="margin-top:10px;background:#4A6D5F;" onclick="registerAccount()">إنشاء حساب جديد</button>
    <button type="button" onclick="resetPassword()" style="display:block;margin:16px auto 0;border:0;background:transparent;color:var(--primary-dark);font:inherit;cursor:pointer;">نسيت كلمة المرور؟</button>
    <p id="authMessage" role="status" style="margin-top:14px;text-align:center;font-size:13px;line-height:1.7;color:var(--danger);"></p>
  </div>
</div>

<!-- الشاشة الرئيسية -->
<div id="homeScreen" style="display: none;">
  <div class="app-header">
    <div class="header-title">بيت <span id="usernameDisplay">حسان</span> <span>🏠</span></div>
    <div class="header-actions">
      <span id="syncBadge" class="sync-badge syncing">⏳ جارٍ</span>
      <button class="icon-btn" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
      <button class="icon-btn" onclick="showMonthlyReport()" title="الأرشيف والسجل الشهري">📅</button>
      <button class="icon-btn" onclick="logout()" title="خروج">🚪</button>
    </div>
  </div>

  <div class="container">
    <!-- بطاقة الملخص العلوي المفقودة -->
    <div class="summary-card">
      <div class="summary-row">
        <div>
          <div class="summary-label">💰 إجمالي مشتريات اليوم</div>
          <div class="summary-value"><span id="totalPrice">0.00</span> <small>$</small></div>
        </div>
        <div style="font-size: 40px; opacity: 0.4;">🛒</div>
      </div>
      <div class="summary-stats">
        <div class="summary-stat">
          <div class="summary-stat-label">📦 إجمالي المواد</div>
          <div class="summary-stat-value"><span id="totalWeight">0</span> <small style="font-size:12px;">مادة</small></div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">✅ مكتملة</div>
          <div class="summary-stat-value"><span id="doneCount">0</span></div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">⏳ معلّقة</div>
          <div class="summary-stat-value"><span id="activeCount">0</span></div>
        </div>
      </div>
    </div>

    <button class="action-main-btn" onclick="openAddItemModal()">➕ إضافة مادة جديدة لليوم</button>
    <button class="archive-day-btn" onclick="archiveCurrentDay()">📥 أرشفة ونهاية اليوم (ترحيل للسجل وبدء يوم جديد)</button>
    <button class="monthly-big-btn" onclick="showMonthlyReport()">📅 تصفح السجل الشهري والأرشيف وحفظ PDF</button>

    <div class="today-bar" id="currentDateBar">
      <span>📅 نشاط اليوم</span>
      <span id="dateDisplayString" style="color: var(--text-light); font-size: 12.5px;"></span>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث في مواد اليوم..." oninput="filterTodayItems()">
    </div>

    <div id="itemsList"></div>

    <div class="backup-actions">
        <button class="btn" onclick="exportData()">📤 تصدير البيانات</button>
        <label class="btn" style="text-align:center; justify-content:center; display:flex; cursor:pointer;">
            📥 استيراد البيانات
            <input type="file" id="importFile" accept=".json" onchange="importData(event)">
        </label>
    </div>
  </div>

  <button class="calc-fab" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
</div>

<!-- نافذة إضافة مادة جديدة -->
<div id="addItemModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title"><span>➕ إضافة مادة جديدة</span><button class="sheet-close" onclick="closeAddItemModal()">✕</button></div>
    <div class="form-group"><label class="form-label">اسم المادة</label><input type="text" id="itemNameInput" class="form-control" placeholder="مثال: تفاح أحمر"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">السعر ($)</label><input type="number" id="itemPriceInput" class="form-control" placeholder="0.00" step="0.01"></div>
      <div class="form-group"><label class="form-label">الكمية</label><input type="number" id="itemWeightInput" class="form-control" placeholder="1"></div>
    </div>
    <div class="form-group" style="margin-bottom: 10px;">
      <label class="form-label">وحدة القياس</label>
      <select id="itemUnitInput" class="form-control"><option value="كغ">كغ</option><option value="ليتر">ليتر</option><option value="علبه">علبه</option><option value="ربطة">ربطة</option><option value="قطعة">قطعة</option></select>
    </div>
    <button class="btn-submit" onclick="submitNewItem()">حفظ المادة</button>
  </div>
</div>

<!-- نافذة تعديل مادة اليوم -->
<div id="editDailyItemModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title"><span>✏️ تعديل مادة اليوم</span><button class="sheet-close" onclick="closeEditDailyItemModal()">✕</button></div>
    <input type="hidden" id="editDailyItemId">
    <div class="form-group" style="margin-bottom:12px;"><label class="form-label">اسم المادة</label><input type="text" id="editDailyItemName" class="form-control"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">السعر ($)</label><input type="number" id="editDailyItemPrice" class="form-control" step="0.01"></div>
      <div class="form-group"><label class="form-label">الكمية</label><input type="number" id="editDailyItemWeight" class="form-control"></div>
    </div>
    <div class="form-group" style="margin-bottom:10px;"><label class="form-label">وحدة القياس</label><select id="editDailyItemUnit" class="form-control"><option value="كغ">كغ</option><option value="ليتر">ليتر</option><option value="علبه">علبه</option><option value="ربطة">ربطة</option><option value="قطعة">قطعة</option></select></div>
    <button class="btn-submit" onclick="saveEditedDailyItem()">💾 حفظ التعديل</button>
  </div>
</div>

<!-- نافذة تعديل مادة في السجل -->
<div id="editItemModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title"><span>✏️ تعديل مادة في السجل</span><button class="sheet-close" onclick="closeEditItemModal()">✕</button></div>
    <input type="hidden" id="editItemArchId">
    <div class="form-group" style="margin-bottom:12px;"><label class="form-label">اسم المادة</label><input type="text" id="editItemName" class="form-control"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">السعر ($)</label><input type="number" id="editItemPrice" class="form-control" step="0.01"></div>
      <div class="form-group"><label class="form-label">الكمية</label><input type="number" id="editItemWeight" class="form-control"></div>
    </div>
    <div class="form-group" style="margin-bottom:10px;"><label class="form-label">وحدة القياس</label><select id="editItemUnit" class="form-control"><option value="كغ">كغ</option><option value="ليتر">ليتر</option><option value="علبه">علبه</option><option value="ربطة">ربطة</option><option value="قطعة">قطعة</option></select></div>
    <button class="btn-submit" onclick="saveEditedArchiveItem()">💾 حفظ التعديل</button>
    <button class="btn-danger" onclick="deleteArchiveItemFromModal()">🗑️ حذف هذه المادة نهائياً</button>
  </div>
</div>

<!-- نافذة الآلة الحاسبة -->
<div id="calculatorModal" class="modal-overlay">
  <div class="sheet">
    <div class="sheet-title"><span>🧮 الآلة الحاسبة</span><button class="sheet-close" onclick="closeCalculator()">✕</button></div>
    <div class="calculator-grid">
      <div class="calc-screen" id="calcScreen">0</div>
      <button class="calc-btn mem" onclick="calcMemory('MC')">MC</button><button class="calc-btn mem" onclick="calcMemory('MR')">MR</button><button class="calc-btn mem" onclick="calcMemory('M+')">M+</button><button class="calc-btn clear" onclick="clearCalc()">C</button>
      <button class="calc-btn" onclick="deleteCalcChar()">⌫</button><button class="calc-btn op" onclick="pressCalc('/')">÷</button><button class="calc-btn op" onclick="pressCalc('*')">×</button><button class="calc-btn op" onclick="pressCalc('-')">-</button>
      <button class="calc-btn" onclick="pressCalc('7')">7</button><button class="calc-btn" onclick="pressCalc('8')">8</button><button class="calc-btn" onclick="pressCalc('9')">9</button><button class="calc-btn op" onclick="pressCalc('+')">+</button>
      <button class="calc-btn" onclick="pressCalc('4')">4</button><button class="calc-btn" onclick="pressCalc('5')">5</button><button class="calc-btn" onclick="pressCalc('6')">6</button><button class="calc-btn equal" onclick="calculateResult()">=</button>
      <button class="calc-btn" onclick="pressCalc('1')">1</button><button class="calc-btn" onclick="pressCalc('2')">2</button><button class="calc-btn" onclick="pressCalc('3')">3</button>
      <button class="calc-btn" onclick="pressCalc('0')" style="grid-column: span 2;">0</button><button class="calc-btn" onclick="pressCalc('.')">.</button>
