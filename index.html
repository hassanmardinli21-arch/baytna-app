<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6B9080">
<title>بيتنا</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F1EA;
    --card: #FFFFFF;
    --primary: #6B9080;
    --primary-dark: #4A6D5F;
    --accent: #C9A58D;
    --text: #2D3A3A;
    --text-light: #7A8787;
    --border: #EAE3D9;
    --danger: #B87B6E;
    --success: #7BA77E;
    --warning: #D4A55C;
    --shadow: 0 2px 12px rgba(45, 58, 58, 0.06);
    --shadow-lg: 0 8px 32px rgba(45, 58, 58, 0.12);
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body { padding-bottom: 100px; }

  .login-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    background: linear-gradient(160deg, #F5F1EA 0%, #E8DFD2 100%);
  }
  .login-logo {
    width: 90px; height: 90px;
    border-radius: 28px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    margin-bottom: 24px;
    box-shadow: 0 12px 32px rgba(107, 144, 128, 0.3);
  }
  .login-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .login-sub { color: var(--text-light); font-size: 15px; margin-bottom: 40px; }
  .login-form { width: 100%; max-width: 360px; }
  .input-group { margin-bottom: 16px; }
  .input-label { font-size: 14px; color: var(--text-light); margin-bottom: 8px; display: block; font-weight: 500; }
  .input-field {
    width: 100%;
    padding: 16px 18px;
    border: 2px solid var(--border);
    border-radius: 16px;
    background: var(--card);
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    transition: all 0.2s;
  }
  .input-field:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(107, 144, 128, 0.12);
  }
  .btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(107, 144, 128, 0.25);
  }
  .btn:active { transform: scale(0.98); }

  .hidden { display: none !important; }
  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(245, 241, 234, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-title span { color: var(--primary); }
  .header-actions { display: flex; gap: 10px; }
  .icon-btn {
    width: 42px; height: 42px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
  }
  .icon-btn:active { transform: scale(0.95); }
  .notif-dot {
    position: absolute;
    top: 8px; left: 8px;
    min-width: 18px; height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: var(--danger);
    color: white;
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--bg);
  }
  .container { max-width: 560px; margin: 0 auto; padding: 16px 20px; }

  .summary-card {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    padding: 22px;
    border-radius: 22px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(107, 144, 128, 0.25);
  }
  .summary-label { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
  .summary-value { font-size: 32px; font-weight: 700; }
  .summary-value small { font-size: 16px; font-weight: 500; opacity: 0.9; }
  .summary-row { display: flex; justify-content: space-between; align-items: center; }
  .summary-stats { display: flex; gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.2); }
  .summary-stat { flex: 1; }
  .summary-stat-label { font-size: 12px; opacity: 0.8; margin-bottom: 2px; }
  .summary-stat-value { font-size: 18px; font-weight: 700; }

  /* ====== حقل السعر في النموذج ====== */
  .form-row-3 { display: flex; gap: 10px; }
  .form-row-3 > * { flex: 1; }
  .form-row-3 > .price-field { flex: 1.2; }

  .search-wrap { position: relative; margin-bottom: 16px; }
  .search-input {
    width: 100%;
    padding: 14px 44px 14px 18px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
  }
  .search-input:focus { outline: none; border-color: var(--primary); }
  .search-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: 0.5; }

  .input-with-mic { position: relative; }
  .input-with-mic .input-field { padding-left: 56px; }
  .mic-btn {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 38px; height: 38px;
    border-radius: 11px;
    border: none;
    background: #F0EBE0;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .mic-btn:active { transform: translateY(-50%) scale(0.95); }
  .mic-btn.listening {
    background: #FFE0DC;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: translateY(-50%) scale(1); }
    50% { transform: translateY(-50%) scale(1.1); }
  }

  /* ====== بطاقة المادة ====== */
  .item-card {
    background: var(--card);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }

  /* ✅ المواد الملغاة: خلفية داكنة + إطار أحمر */
  .item-card.cancelled {
    background: #2A2A2A;
    border: 2px solid #B87B6E;
    opacity: 1;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .item-card.cancelled .item-name {
    color: #E8E8E8;
    text-decoration: line-through;
    text-decoration-color: var(--danger);
    text-decoration-thickness: 2px;
  }
  .item-card.cancelled .item-meta,
  .item-card.cancelled .item-meta .item-badge {
    color: #A8A8A8;
  }
  .item-card.cancelled .item-badge {
    background: #3A3A3A;
    color: #C0C0C0;
  }
  .item-card.cancelled .item-badge.cancelled {
    background: var(--danger);
    color: white;
  }
  .item-card.cancelled .item-weight {
    color: #B87B6E;
  }
  .item-card.cancelled .item-weight small {
    color: #A8A8A8;
  }
  .item-card.cancelled .item-price-badge {
    background: #3A3A3A;
    color: #B87B6E;
    border-color: #B87B6E;
  }
  .item-card.cancelled .action-btn {
    border-color: #444;
    color: #D0D0D0;
  }
  .item-card.cancelled .action-btn.delete {
    color: #FF8A7A;
    border-color: #6A3A35;
  }
  .item-card.cancelled .action-btn.restore {
    color: #9FD5A3;
    border-color: #3A6A3F;
  }
  .item-card.cancelled .action-btn.edit {
    color: #A8C4B5;
    border-color: #3A5A4A;
  }
  .item-card.cancelled .item-actions {
    border-top-color: #444;
  }

  .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 10px; }
  .item-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .item-meta { font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 6px;
    background: #F0EBE0;
    font-size: 11px;
    color: var(--text-light);
    font-weight: 500;
  }
  .item-badge.cancelled { background: #F5E0DC; color: var(--danger); }

  /* ====== عرض السعر ====== */
  .item-price-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border-radius: 10px;
    background: #E8F5E9;
    color: #1B5E20;
    font-size: 14px;
    font-weight: 700;
    border: 1.5px solid #7BA77E;
    margin-top: 6px;
  }
  .item-price-badge::before { content: "💰"; font-size: 13px; }

  .item-weight {
    text-align: left;
    font-size: 22px;
    font-weight: 700;
    color: var(--primary-dark);
    line-height: 1;
    flex-shrink: 0;
  }
  .item-weight small { font-size: 12px; color: var(--text-light); font-weight: 500; display: block; margin-top: 2px; }

  .item-media { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .media-thumb {
    width: 70px; height: 70px;
    border-radius: 12px;
    object-fit: cover;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .audio-btn {
    padding: 8px 14px;
    border-radius: 10px;
    background: #F0EBE0;
    border: none;
    font-size: 13px;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .item-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .action-btn {
    flex: 1;
    padding: 10px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all 0.15s;
  }
  .action-btn:active { transform: scale(0.97); }
  .action-btn.delete { color: var(--danger); border-color: #F0D5CF; }
  .action-btn.edit { color: var(--primary-dark); border-color: #D5E3DC; }
  .action-btn.cancel { color: var(--warning); border-color: #EDDFC8; }
  .action-btn.restore { color: var(--success); border-color: #D5E3DC; }

  /* ====== فاصل قسم الملغاة ====== */
  .cancelled-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 12px;
    color: var(--danger);
    font-size: 14px;
    font-weight: 700;
  }
  .cancelled-divider::before,
  .cancelled-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--danger), transparent);
    opacity: 0.5;
  }

  .fab {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 16px 32px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    border: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(107, 144, 128, 0.35);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 50;
    transition: all 0.2s;
  }
  .fab:active { transform: translateX(-50%) scale(0.96); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(45, 58, 58, 0.5);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet {
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    background: var(--bg);
    border-radius: 28px 28px 0 0;
    padding: 8px 20px 32px;
    overflow-y: auto;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 8px auto 20px;
  }
  .sheet-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sheet-close {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .form-row { display: flex; gap: 10px; }
  .form-row > * { flex: 1; }
  .media-picker {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 6px;
  }
  .media-pick-btn {
    padding: 16px;
    border-radius: 14px;
    background: var(--card);
    border: 2px dashed var(--border);
    font-family: inherit;
    font-size: 14px;
    color: var(--text-light);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .media-pick-btn:active { border-color: var(--primary); background: #F0F5F2; }
  .media-pick-btn .emoji { font-size: 24px; }
  .preview-wrap { margin-top: 10px; }
  .preview-thumb {
    width: 100%;
    border-radius: 14px;
    max-height: 200px;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  .preview-audio { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--card); border-radius: 14px; border: 1px solid var(--border); }
  audio { width: 100%; height: 40px; }

  .activity-item {
    display: flex;
    gap: 12px;
    padding: 12px;
    background: var(--card);
    border-radius: 14px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
  }
  .activity-icon {
    width: 38px; height: 38px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .activity-icon.add { background: #E3EDE7; }
  .activity-icon.edit { background: #E8EEF2; }
  .activity-icon.delete { background: #F5E0DC; }
  .activity-icon.cancel { background: #F5EEDC; }
  .activity-icon.restore { background: #E3EDE7; }
  .activity-content { flex: 1; min-width: 0; }
  .activity-text { font-size: 14px; margin-bottom: 3px; }
  .activity-text b { color: var(--primary-dark); }
  .activity-time { font-size: 11px; color: var(--text-light); }

  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    background: var(--text);
    color: white;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    z-index: 1000;
    box-shadow: var(--shadow-lg);
    animation: toastIn 0.3s;
    max-width: 90%;
    text-align: center;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-emoji { font-size: 56px; margin-bottom: 12px; opacity: 0.5; }
  .empty-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .empty-sub { font-size: 14px; }

  .image-viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .image-viewer img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
  .image-viewer-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: white;
    border: none;
    font-size: 24px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-logo">🏠</div>
  <div class="login-title">بيتنا</div>
  <div class="login-sub">إدارة مخزون المنزل بذكاء</div>
  <div class="login-form">
    <div class="input-group">
      <label class="input-label">اسمك</label>
      <div class="input-with-mic">
        <input type="text" id="usernameInput" class="input-field" placeholder="مثال: حسن" autocomplete="off">
        <button type="button" class="mic-btn" id="mic_usernameInput" onclick="startVoiceInput('usernameInput')">🎤</button>
      </div>
    </div>
    <button class="btn" onclick="login()">دخول</button>
  </div>
</div>

<div id="homeScreen" class="hidden">
  <div class="app-header">
    <div class="header-title">بيت <span id="usernameDisplay"></span></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="showActivity()">
        🔔
        <span id="notifDot" class="notif-dot hidden">0</span>
      </button>
      <button class="icon-btn" onclick="logout()">🚪</button>
    </div>
  </div>

  <div class="container">
    <!-- ============ بطاقة الملخص ============ -->
    <div class="summary-card">
      <!-- إجمالي السعر (الأهم) -->
      <div class="summary-row">
        <div>
          <div class="summary-label">💰 إجمالي المشتريات</div>
          <div class="summary-value"><span id="totalPrice">0.00</span> <small>$</small></div>
        </div>
        <div style="font-size: 40px; opacity: 0.4;">🛒</div>
      </div>
      <!-- إجمالي الوزن -->
      <div class="summary-stats">
        <div class="summary-stat">
          <div class="summary-stat-label">📦 إجمالي الوزن</div>
          <div class="summary-stat-value"><span id="totalWeight">0</span> <small style="font-size:12px;opacity:0.9;">كغ</small></div>
        </div>
      </div>
      <!-- عدد المواد -->
      <div class="summary-stats">
        <div class="summary-stat">
          <div class="summary-stat-label">عدد المواد</div>
          <div class="summary-stat-value" id="totalItems">0</div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">الملغاة</div>
          <div class="summary-stat-value" id="cancelledItems">0</div>
        </div>
        <div class="summary-stat">
          <div class="summary-stat-label">💰 سعر النشطة</div>
          <div class="summary-stat-value" id="activePrice">0.00</div>
        </div>
      </div>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن مادة..." oninput="renderItems()">
      <span class="search-icon">🔍</span>
    </div>

    <div id="itemsList"></div>
  </div>

  <button class="fab" onclick="openItemSheet()">
    <span>＋</span> إضافة مادة
  </button>
</div>

<div id="imageViewer" class="image-viewer hidden" onclick="closeImageViewer()">
  <button class="image-viewer-close" onclick="closeImageViewer()">✕</button>
  <img id="imageViewerImg" src="">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc, updateDoc,
  onSnapshot, query, orderBy, serverTimestamp, limit
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGET1u-j9p7TCkAXmZJWdjp0HLNszVC9Q",
  authDomain: "baytna-e0a77.firebaseapp.com",
  projectId: "baytna-e0a77",
  storageBucket: "baytna-e0a77.firebasestorage.app",
  messagingSenderId: "807987531508",
  appId: "1:807987531508:android:3f54b1ad2751b0ca31d8a1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let username = "";
let items = [];
let activities = [];
let editingId = null;
let pendingImage = null;
let pendingAudio = null;

window.login = function() {
  const val = document.getElementById("usernameInput").value.trim();
  if (!val) { toast("اكتب اسمك أولاً"); return; }
  username = val;
  localStorage.setItem("baytna_user", val);
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("homeScreen").classList.remove("hidden");
  document.getElementById("usernameDisplay").textContent = username;
  listenItems();
  listenActivities();
};

window.logout = function() {
  localStorage.removeItem("baytna_user");
  location.reload();
};

const savedUser = localStorage.getItem("baytna_user");
if (savedUser) {
  document.getElementById("usernameInput").value = savedUser;
}

function listenItems() {
  const q = query(collection(db, "items"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    renderItems();
    updateSummary();
  }, (error) => {
    console.error("خطأ في القراءة:", error);
  });
}

function listenActivities() {
  const q = query(collection(db, "activity"), orderBy("at", "desc"), limit(30));
  onSnapshot(q, (snapshot) => {
    activities = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    updateNotifBadge();
  });
}

async function logActivity(action, itemName, details = "") {
  try {
    await addDoc(collection(db, "activity"), {
      action,
      itemName,
      by: username,
      at: serverTimestamp(),
      details
    });
  } catch(e) { console.error(e); }
}

// ============ عرض المواد (مع فصل الملغاة) ============
window.renderItems = function() {
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  const list = document.getElementById("itemsList");
  let filtered = items;
  if (search) filtered = items.filter(i => (i.name || "").toLowerCase().includes(search));

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-emoji">📭</div>
        <div class="empty-title">${search ? "لا توجد نتائج" : "لا توجد مواد بعد"}</div>
        <div class="empty-sub">${search ? "جرب كلمة أخرى" : "اضغط إضافة مادة للبدء"}</div>
      </div>`;
    return;
  }

  // ✅ فصل المواد: النشطة أولاً، الملغاة في الأسفل
  const activeItems = filtered.filter(i => i.status !== "cancelled");
  const cancelledItems = filtered.filter(i => i.status === "cancelled");

  let html = "";

  // المواد النشطة
  activeItems.forEach(item => {
    html += buildItemCard(item);
  });

  // فاصل قسم الملغاة
  if (cancelledItems.length > 0) {
    html += `<div class="cancelled-divider">⏸️ المواد الملغاة (${cancelledItems.length})</div>`;
    cancelledItems.forEach(item => {
      html += buildItemCard(item);
    });
  }

  list.innerHTML = html;
};

// ✅ دالة بناء بطاقة المادة
function buildItemCard(item) {
  const cancelled = item.status === "cancelled";
  const createdBy = item.createdBy || "؟";
  const updatedBy = item.updatedBy;
  const updatedAt = item.updatedAt ? timeAgo(item.updatedAt.toDate()) : null;
  const imageHtml = item.image ? `<img src="${item.image}" class="media-thumb" onclick="viewImage('${item.id}')">` : "";
  const audioHtml = item.audio ? `<button class="audio-btn" onclick="playAudio('${item.id}')">🎵 تشغيل</button>` : "";
  const mediaHtml = (imageHtml || audioHtml) ? `<div class="item-media">${imageHtml}${audioHtml}</div>` : "";

  // ✅ عرض السعر (إن وجد)
  const priceHtml = (item.price !== undefined && item.price !== null && item.price !== "")
    ? `<span class="item-price-badge">${parseFloat(item.price).toFixed(2)}</span>`
    : "";

  return `
    <div class="item-card ${cancelled ? 'cancelled' : ''}">
      <div class="item-header">
        <div style="flex:1; min-width:0;">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="item-meta">
            <span class="item-badge">👤 ${escapeHtml(createdBy)}</span>
            ${cancelled ? '<span class="item-badge cancelled">ملغاة</span>' : ''}
            ${updatedBy ? `<span class="item-badge">✏️ ${escapeHtml(updatedBy)} · ${updatedAt}</span>` : ''}
          </div>
          ${priceHtml}
        </div>
        <div class="item-weight">
          ${item.weight || 0}
          <small>${item.unit || "كغ"}</small>
        </div>
      </div>
      ${mediaHtml}
      <div class="item-actions">
        ${cancelled
          ? `<button class="action-btn restore" onclick="toggleCancel('${item.id}')">♻️ استرجاع</button>`
          : `<button class="action-btn cancel" onclick="toggleCancel('${item.id}')">⏸️ إلغاء</button>`
        }
        <button class="action-btn edit" onclick="openItemSheet('${item.id}')">✏️ تعديل</button>
        <button class="action-btn delete" onclick="deleteItem('${item.id}')">🗑️ حذف</button>
      </div>
    </div>
  `;
}

// ✅ حساب الإجماليات
function updateSummary() {
  const active = items.filter(i => i.status !== "cancelled");
  const cancelled = items.filter(i => i.status === "cancelled");

  // إجمالي الوزن (النشطة فقط)
  const totalWeight = active.reduce((s, i) => s + (parseFloat(i.weight) || 0), 0);

  // إجمالي السعر (النشطة فقط)
  const activePrice = active.reduce((s, i) => s + (parseFloat(i.price) || 0), 0);

  // إجمالي السعر (الكل)
  const totalPrice = items.reduce((s, i) => s + (parseFloat(i.price) || 0), 0);

  document.getElementById("totalWeight").textContent = totalWeight.toFixed(1);
  document.getElementById("totalPrice").textContent = totalPrice.toFixed(2);
  document.getElementById("activePrice").textContent = activePrice.toFixed(2);
  document.getElementById("totalItems").textContent = active.length;
  document.getElementById("cancelledItems").textContent = cancelled.length;
}

window.openItemSheet = function(id = null) {
  editingId = id;
  pendingImage = null;
  pendingAudio = null;

  const item = id ? items.find(i => i.id === id) : null;
  const title = item ? "تعديل المادة" : "إضافة مادة جديدة";

  if (item) {
    pendingImage = item.image || null;
    pendingAudio = item.audio || null;
  }

  const html = `
    <div class="modal-overlay" onclick="if(event.target===this) closeSheet()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-title">
          ${title}
          <button class="sheet-close" onclick="closeSheet()">✕</button>
        </div>

        <div class="input-group">
          <label class="input-label">اسم المادة</label>
          <div class="input-with-mic">
            <input type="text" id="itemName" class="input-field" placeholder="مثال: أرز" value="${item ? escapeHtml(item.name) : ''}">
            <button type="button" class="mic-btn" id="mic_itemName" onclick="startVoiceInput('itemName')">🎤</button>
          </div>
        </div>

        <div class="form-row-3">
          <div class="input-group">
            <label class="input-label">الوزن</label>
            <input type="number" id="itemWeight" class="input-field" placeholder="0" step="0.1" value="${item ? (item.weight || '') : ''}">
          </div>
          <div class="input-group">
            <label class="input-label">الوحدة</label>
            <select id="itemUnit" class="input-field">
              <option value="كغ" ${item && item.unit==="كغ"?"selected":""}>كغ</option>
              <option value="غم" ${item && item.unit==="غم"?"selected":""}>غم</option>
              <option value="لتر" ${item && item.unit==="لتر"?"selected":""}>لتر</option>
              <option value="مل" ${item && item.unit==="مل"?"selected":""}>مل</option>
              <option value="حبة" ${item && item.unit==="حبة"?"selected":""}>حبة</option>
              <option value="علبة" ${item && item.unit==="علبة"?"selected":""}>علبة</option>
            </select>
          </div>
          <div class="input-group price-field">
            <label class="input-label">💰 السعر ($)</label>
            <input type="number" id="itemPrice" class="input-field" placeholder="0.00" step="0.01" value="${item && item.price !== undefined && item.price !== null ? item.price : ''}">
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">إضافة وسائط</label>
          <div class="media-picker">
            <button type="button" class="media-pick-btn" onclick="pickCamera()">
              <span class="emoji">📷</span>
              <span>الكاميرا</span>
            </button>
            <button type="button" class="media-pick-btn" onclick="pickGallery()">
              <span class="emoji">🖼️</span>
              <span>المعرض</span>
            </button>
            <button type="button" class="media-pick-btn" onclick="pickAudio()">
              <span class="emoji">🎤</span>
              <span>ملف صوتي</span>
            </button>
            <button type="button" class="media-pick-btn" onclick="removeMedia()">
              <span class="emoji">✕</span>
              <span>إزالة</span>
            </button>
          </div>
        </div>

        <div id="mediaPreview" class="preview-wrap"></div>

        <button class="btn" onclick="saveItem()" style="margin-top: 20px;">
          ${item ? "💾 حفظ التعديلات" : "＋ إضافة المادة"}
        </button>
      </div>
    </div>
  `;

  document.body.insertAdjacentHTML("beforeend", html);
  updateMediaPreview();
};

window.closeSheet = function() {
  if (recognition) { try { recognition.stop(); } catch(e) {} }
  document.querySelector(".modal-overlay")?.remove();
  editingId = null;
  pendingImage = null;
  pendingAudio = null;
};

window.pickCamera = function() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.capture = "environment";
  inp.onchange = (e) => handleImage(e.target.files[0]);
  inp.click();
};

window.pickGallery = function() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.onchange = (e) => handleImage(e.target.files[0]);
  inp.click();
};

window.pickAudio = function() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "audio/*";
  inp.onchange = (e) => handleAudio(e.target.files[0]);
  inp.click();
};

window.removeMedia = function() {
  pendingImage = null;
  pendingAudio = null;
  updateMediaPreview();
};

function handleImage(file) {
  if (!file) return;
  if (file.size > 900000) {
    compressImage(file, (data) => {
      pendingImage = data;
      updateMediaPreview();
    });
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      pendingImage = e.target.result;
      updateMediaPreview();
    };
    reader.readAsDataURL(file);
  }
}

function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      let { width, height } = img;
      const maxSize = 800;
      if (width > maxSize || height > maxSize) {
        if (width > height) { height = (height / width) * maxSize; width = maxSize; }
        else { width = (width / height) * maxSize; height = maxSize; }
      }
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL("image/jpeg", 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleAudio(file) {
  if (!file) return;
  if (file.size > 900000) {
    toast("الصوت كبير جداً. جرب تسجيل أقصر");
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    pendingAudio = e.target.result;
    updateMediaPreview();
  };
  reader.readAsDataURL(file);
}

function updateMediaPreview() {
  const prev = document.getElementById("mediaPreview");
  if (!prev) return;
  let html = "";
  if (pendingImage) {
    html += `<img src="${pendingImage}" class="preview-thumb">`;
  }
  if (pendingAudio) {
    html += `<div class="preview-audio"><span>🎵</span><audio controls src="${pendingAudio}"></audio></div>`;
  }
  prev.innerHTML = html;
}

window.saveItem = async function() {
  const name = document.getElementById("itemName").value.trim();
  const weight = parseFloat(document.getElementById("itemWeight").value) || 0;
  const unit = document.getElementById("itemUnit").value;
  const priceRaw = document.getElementById("itemPrice").value;
  const price = priceRaw === "" ? null : (parseFloat(priceRaw) || 0);

  if (!name) { toast("اكتب اسم المادة"); return; }

  try {
    if (editingId) {
      await updateDoc(doc(db, "items", editingId), {
        name, weight, unit, price,
        image: pendingImage,
        audio: pendingAudio,
        updatedBy: username,
        updatedAt: serverTimestamp()
      });
      await logActivity("edit", name);
      toast("✅ تم التعديل");
    } else {
      await addDoc(collection(db, "items"), {
        name, weight, unit, price,
        image: pendingImage,
        audio: pendingAudio,
        status: "active",
        createdBy: username,
        createdAt: serverTimestamp()
      });
      await logActivity("add", name);
      toast("✅ تمت الإضافة");
    }
    closeSheet();
  } catch(e) {
    console.error(e);
    toast("حدث خطأ: " + e.message);
  }
};

window.deleteItem = async function(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  if (!confirm(`هل أنت متأكد من حذف "${item.name}"؟`)) return;
  try {
    await deleteDoc(doc(db, "items", id));
    await logActivity("delete", item.name);
    toast("🗑️ تم الحذف");
  } catch(e) { toast("خطأ: " + e.message); }
};

window.toggleCancel = async function(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const newStatus = item.status === "cancelled" ? "active" : "cancelled";
  try {
    await updateDoc(doc(db, "items", id), {
      status: newStatus,
      updatedBy: username,
      updatedAt: serverTimestamp()
    });
    await logActivity(newStatus === "cancelled" ? "cancel" : "restore", item.name);
    toast(newStatus === "cancelled" ? "⏸️ تم الإلغاء" : "♻️ تم الاسترجاع");
  } catch(e) { toast("خطأ: " + e.message); }
};

window.viewImage = function(id) {
  const item = items.find(i => i.id === id);
  if (!item || !item.image) return;
  document.getElementById("imageViewerImg").src = item.image;
  document.getElementById("imageViewer").classList.remove("hidden");
};

window.closeImageViewer = function() {
  document.getElementById("imageViewer").classList.add("hidden");
};

window.playAudio = function(id) {
  const item = items.find(i => i.id === id);
  if (!item || !item.audio) return;
  const audio = new Audio(item.audio);
  audio.play();
};

window.showActivity = function() {
  localStorage.setItem("lastSeenActivity", Date.now());

  const actionText = {
    add: "أضاف",
    edit: "عدّل",
    delete: "حذف",
    cancel: "ألغى",
    restore: "استرجع"
  };
  const actionIcon = {
    add: "➕", edit: "✏️", delete: "🗑️", cancel: "⏸️", restore: "♻️"
  };

  const list = activities.length === 0
    ? `<div class="empty"><div class="empty-emoji">📜</div><div class="empty-title">لا يوجد سجل بعد</div></div>`
    : activities.map(a => `
        <div class="activity-item">
          <div class="activity-icon ${a.action}">${actionIcon[a.action] || "•"}</div>
          <div class="activity-content">
            <div class="activity-text"><b>${escapeHtml(a.by)}</b> ${actionText[a.action] || ""} "${escapeHtml(a.itemName)}"</div>
            <div class="activity-time">${a.at ? timeAgo(a.at.toDate()) : ""}</div>
          </div>
        </div>
      `).join("");

  const html = `
    <div class="modal-overlay" onclick="if(event.target===this) closeActivity()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div class="sheet-title">
          سجل التعديلات
          <button class="sheet-close" onclick="closeActivity()">✕</button>
        </div>
        ${list}
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML("beforeend", html);
  updateNotifBadge();
};

window.closeActivity = function() {
  document.querySelector(".modal-overlay")?.remove();
};

function updateNotifBadge() {
  const lastSeen = parseInt(localStorage.getItem("lastSeenActivity") || "0");
  const unread = activities.filter(a => a.at && a.at.toDate().getTime() > lastSeen).length;
  const dot = document.getElementById("notifDot");
  if (!dot) return;
  if (unread > 0) {
    dot.textContent = unread > 9 ? "9+" : unread;
    dot.classList.remove("hidden");
  } else {
    dot.classList.add("hidden");
  }
}

// ========== الكتابة بالصوت ==========
let recognition = null;
let activeVoiceInput = null;

window.startVoiceInput = function(inputId) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    toast("المتصفح لا يدعم الكتابة بالصوت. استخدم Chrome أو Safari");
    return;
  }

  const input = document.getElementById(inputId);
  const btn = document.getElementById("mic_" + inputId);
  if (!input) return;

  if (recognition && activeVoiceInput === inputId) {
    try { recognition.stop(); } catch(e) {}
    return;
  }

  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }

  recognition = new SpeechRecognition();
  recognition.lang = "ar-SA";
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  activeVoiceInput = inputId;

  recognition.onstart = () => {
    if (btn) {
      btn.textContent = "⏹";
      btn.classList.add("listening");
    }
    input.placeholder = "🎤 تحدث الآن...";
  };

  recognition.onresult = (event) => {
    let transcript = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    input.value = transcript;
  };

  recognition.onerror = (event) => {
    console.error("خطأ في التعرف على الصوت:", event.error);
    if (event.error === "not-allowed") {
      toast("الرجاء السماح بالوصول للميكروفون");
    } else if (event.error === "no-speech") {
      toast("لم يتم التعرف على أي كلام");
    } else {
      toast("خطأ: " + event.error);
    }
    resetVoiceBtn(inputId);
  };

  recognition.onend = () => {
    resetVoiceBtn(inputId);
    if (input.value.trim()) {
      toast("✅ تم التعرف بنجاح");
    }
  };

  try {
    recognition.start();
  } catch(e) {
    console.error(e);
    toast("تعذر بدء التسجيل");
    resetVoiceBtn(inputId);
  }
};

function resetVoiceBtn(inputId) {
  const btn = document.getElementById("mic_" + inputId);
  if (btn) {
    btn.textContent = "🎤";
    btn.classList.remove("listening");
  }
  activeVoiceInput = null;
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function timeAgo(date) {
  const sec = Math.floor((Date.now() - date.getTime()) / 1000);
  if (sec < 60) return "الآن";
  if (sec < 3600) return `منذ ${Math.floor(sec/60)} دقيقة`;
  if (sec < 86400) return `منذ ${Math.floor(sec/3600)} ساعة`;
  if (sec < 604800) return `منذ ${Math.floor(sec/86400)} يوم`;
  return date.toLocaleDateString("ar");
}

function toast(msg) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}
</script>
