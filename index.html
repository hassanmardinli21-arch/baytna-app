<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6B9080">
<title>بيتنا</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F5F1EA; --card: #FFFFFF;
    --primary: #6B9080; --primary-dark: #4A6D5F;
    --accent: #C9A58D; --text: #2D3A3A; --text-light: #7A8787;
    --border: #EAE3D9; --danger: #B87B6E;
    --success: #7BA77E; --success-dark: #4A7C4E;
    --warning: #D4A55C;
    --shadow: 0 2px 12px rgba(45, 58, 58, 0.06);
    --shadow-lg: 0 8px 32px rgba(45, 58, 58, 0.12);
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }
  body { padding-bottom: 100px; }

  .hidden { display: none !important; }
  .app-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245, 241, 234, 0.92);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-title span { color: var(--primary); }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; cursor: pointer; position: relative;
    box-shadow: var(--shadow);
    transition: all 0.2s;
  }
  .icon-btn:active { transform: scale(0.95); }

  .container { max-width: 560px; margin: 0 auto; padding: 16px 20px; }

  .summary-card {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; padding: 22px; border-radius: 22px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(107, 144, 128, 0.25);
  }
  .summary-row { display: flex; justify-content: space-between; align-items: center; }
  .summary-label { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
  .summary-value { font-size: 32px; font-weight: 700; }
  .summary-value small { font-size: 16px; font-weight: 500; opacity: 0.9; }

  .monthly-big-btn {
    width: 100%; padding: 16px; margin-bottom: 12px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%);
    color: white; font-family: inherit;
    font-size: 16px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 18px rgba(184, 123, 58, 0.3);
    transition: all 0.2s;
  }
  .monthly-big-btn:active { transform: scale(0.98); }

  .calc-fab {
    position: fixed; bottom: 24px; left: 24px;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #4A6D5F 0%, #2D3A3A 100%);
    color: white; border: none; font-size: 26px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(45, 58, 58, 0.35);
    z-index: 90; transition: all 0.2s;
  }
  .calc-fab:active { transform: scale(0.92); }

  /* تصميم الآلة الحاسبة */
  .calculator-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px;
  }
  .calc-screen {
    grid-column: span 4;
    background: #2D3A3A; color: #FFFFFF;
    font-size: 28px; font-weight: 700;
    text-align: left; padding: 18px; border-radius: 16px;
    min-height: 65px; word-break: break-all;
    display: flex; align-items: center; justify-content: flex-end;
    direction: ltr;
  }
  .calc-btn {
    padding: 16px; font-size: 20px; font-weight: 700;
    border-radius: 14px; border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .calc-btn:active { transform: scale(0.95); background: #EAE3D9; }
  .calc-btn.op { background: #E8EEF2; color: var(--primary-dark); }
  .calc-btn.equal { background: var(--primary); color: white; border: none; }
  .calc-btn.clear { background: #FFF5F3; color: var(--danger); border-color: #F0D5CF; }

  /* النوافذ المنبثقة (Modals) */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(45, 58, 58, 0.5);
    backdrop-filter: blur(4px); z-index: 500;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 560px; max-height: 90vh;
    background: var(--bg); border-radius: 28px 28px 0 0;
    padding: 20px; overflow-y: auto;
  }
  .sheet-title {
    font-size: 18px; font-weight: 700; margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sheet-close {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--border);
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .month-picker-row {
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  .select-field {
    flex: 1; padding: 12px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card);
    font-size: 14px; font-family: inherit; font-weight: 600;
  }
  .pdf-btn {
    width: 100%; padding: 14px; margin-top: 14px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, #B87B6E 0%, #8A4238 100%);
    color: white; font-family: inherit; font-size: 15px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(184, 123, 110, 0.3);
  }
  .pdf-btn:active { transform: scale(0.98); }
</style>
</head>
<body>

<div id="homeScreen">
  <!-- رأس الصفحة ويحتوي أزرار الآلة الحاسبة والشهور الماضية بوضوح تام -->
  <div class="app-header">
    <div class="header-title">بيت حسان <span>🏠</span></div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
      <button class="icon-btn" onclick="showMonthlyReport()" title="الشّهور الماضية">📅</button>
    </div>
  </div>

  <div class="container">
    <div class="summary-card">
      <div class="summary-row">
        <div>
          <div class="summary-label">💰 إجمالي مشتريات اليوم</div>
          <div class="summary-value"><span id="totalPrice">1050.00</span> <small>$</small></div>
        </div>
        <div style="font-size: 40px; opacity: 0.4;">🛒</div>
      </div>
    </div>

    <!-- زر رئيسي واضح لتصفح الشهور الماضية وحفظ التقرير PDF -->
    <button class="monthly-big-btn" onclick="showMonthlyReport()">📅 تصفح الشهور الماضية وحفظ PDF</button>
  </div>

  <!-- زر حاسبة عائم في الأسفل للوصول الفوري -->
  <button class="calc-fab" onclick="openCalculator()" title="الآلة الحاسبة">🧮</button>
</div>

<!-- نافذة الآلة الحاسبة -->
<div id="calculatorModal" class="modal-overlay hidden">
  <div class="sheet">
    <div class="sheet-title">
      <span>🧮 الآلة الحاسبة</span>
      <button class="sheet-close" onclick="closeCalculator()">✕</button>
    </div>
    <div class="calculator-grid">
      <div class="calc-screen" id="calcScreen">0</div>
      <button class="calc-btn clear" onclick="clearCalc()">C</button>
      <button class="calc-btn op" onclick="pressCalc('/')">÷</button>
      <button class="calc-btn op" onclick="pressCalc('*')">×</button>
      <button class="calc-btn op" onclick="pressCalc('-')">-</button>
      
      <button class="calc-btn" onclick="pressCalc('7')">7</button>
      <button class="calc-btn" onclick="pressCalc('8')">8</button>
      <button class="calc-btn" onclick="pressCalc('9')">9</button>
      <button class="calc-btn op" onclick="pressCalc('+')">+</button>
      
      <button class="calc-btn" onclick="pressCalc('4')">4</button>
      <button class="calc-btn" onclick="pressCalc('5')">5</button>
      <button class="calc-btn" onclick="pressCalc('6')">6</button>
      <button class="calc-btn equal" onclick="calculateResult()" style="grid-row: span 2;">=</button>
      
      <button class="calc-btn" onclick="pressCalc('1')">1</button>
      <button class="calc-btn" onclick="pressCalc('2')">2</button>
      <button class="calc-btn" onclick="pressCalc('3')">3</button>
      
      <button class="calc-btn" onclick="pressCalc('0')" style="grid-column: span 2;">0</button>
      <button class="calc-btn" onclick="pressCalc('.')">.</button>
    </div>
  </div>
</div>

<!-- نافذة تصفح الشهور الماضية وحفظ PDF -->
<div id="monthlyModal" class="modal-overlay hidden">
  <div class="sheet">
    <div class="sheet-title">
      <span>📅 تصفح الشهور الماضية وحفظ PDF</span>
      <button class="sheet-close" onclick="closeMonthlyReport()">✕</button>
    </div>
    
    <div class="month-picker-row">
      <select id="monthSelect" class="select-field" onchange="loadSelectedMonthData()">
        <option value="1">كانون الثاني (يناير)</option>
        <option value="2">شباط (فبراير)</option>
        <option value="3">آذار (مارس)</option>
        <option value="4">نيسان (أبريل)</option>
        <option value="5">أيار (مايو)</option>
        <option value="6">حزيران (يونيو)</option>
        <option value="7">تموز (يوليو)</option>
        <option value="8">آب (أغسطس)</option>
        <option value="9">أيلول (سبتمبر)</option>
        <option value="10">تشرين الأول (أكتوبر)</option>
        <option value="11">تشرين الثاني (نوفمبر)</option>
        <option value="12">كانون الأول (ديسمبر)</option>
      </select>
      <select id="yearSelect" class="select-field" onchange="loadSelectedMonthData()">
        <option value="2026">2026</option>
        <option value="2025">2025</option>
      </select>
    </div>

    <!-- الجزء القابل للطباعة والحفظ كملف PDF -->
    <div id="monthlyReportPrintable">
      <div id="monthlyContent" style="background: var(--card); padding: 16px; border-radius: 16px; border: 1px solid var(--border);">
        <!-- محتوى الشهر -->
      </div>
    </div>

    <button class="pdf-btn" onclick="downloadPDF()">📄 حفظ التقرير كملف PDF</button>
  </div>
</div>

<script>
  // دوال الآلة الحاسبة
  let calcExpression = "";
  function openCalculator() {
    document.getElementById('calculatorModal').classList.remove('hidden');
  }
  function closeCalculator() {
    document.getElementById('calculatorModal').classList.add('hidden');
  }
  function pressCalc(val) {
    calcExpression += val;
    document.getElementById('calcScreen').innerText = calcExpression;
  }
  function clearCalc() {
    calcExpression = "";
    document.getElementById('calcScreen').innerText = "0";
  }
  function calculateResult() {
    try {
      if(!calcExpression) return;
      let res = eval(calcExpression);
      document.getElementById('calcScreen').innerText = res;
      calcExpression = res.toString();
    } catch(e) {
      document.getElementById('calcScreen').innerText = "خطأ";
      calcExpression = "";
    }
  }

  // دوال الشهور الماضية والـ PDF
  function showMonthlyReport() {
    document.getElementById('monthlyModal').classList.remove('hidden');
    const now = new Date();
    document.getElementById('monthSelect').value = (now.getMonth() + 1).toString();
    document.getElementById('yearSelect').value = now.getFullYear().toString();
    loadSelectedMonthData();
  }
  function closeMonthlyReport() {
    document.getElementById('monthlyModal').classList.add('hidden');
  }
  function loadSelectedMonthData() {
    const monthSelect = document.getElementById('monthSelect');
    const monthName = monthSelect.options[monthSelect.selectedIndex].text;
    const year = document.getElementById('yearSelect').value;
    const container = document.getElementById('monthlyContent');
    
    container.innerHTML = `
      <div style="background: linear-gradient(135deg, #C9A961 0%, #B87B3A 100%); color: white; padding: 16px; border-radius: 14px; text-align: center; margin-bottom: 12px;">
        <div style="font-size: 13px; opacity: 0.9;">تقرير شهر ${monthName} ${year}</div>
        <div style="font-size: 24px; font-weight: 700; margin-top: 4px;">0.00 $</div>
      </div>
      <p style="text-align: center; color: var(--text-light); font-size: 13px; padding: 10px;">لا توجد مشتريات مسجلة في هذا الشهر.</p>
    `;
  }
  function downloadPDF() {
    const monthSelect = document.getElementById('monthSelect');
    const monthName = monthSelect.options[monthSelect.selectedIndex].text;
    const year = document.getElementById('yearSelect').value;
    const element = document.getElementById('monthlyReportPrintable');
    
    const opt = {
      margin:       10,
      filename:     `تقرير_بيتنا_${monthName}_${year}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2 },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  }
</script>

</body>
</html>
