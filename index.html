<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بيتنا</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f1ea; }
  .box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
  input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
</style>
</head>
<body>
<div class="box">
  <h2>🏠 بيتنا</h2>
  <input type="email" id="email" value="hassanmardinli21@gmail.com">
  <input type="password" id="pass" placeholder="كلمة المرور">
  <button onclick="login()">تسجيل الدخول</button>
  <div id="msg" style="margin-top:10px;"></div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  const app = initializeApp({ apiKey: "AIzaSyDXVClsWhLOc3m710m2Fy6p5KncFIHQTCU", authDomain: "baytna-10.firebaseapp.com", projectId: "baytna-10", storageBucket: "baytna-10.firebasestorage.app", messagingSenderId: "480526325243", appId: "1:480526325243:web:444940ce97845bf727a75e" });
  const auth = getAuth(app);
  window.login = async function() {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('pass').value;
    const msg = document.getElementById('msg');
    try {
      msg.innerText = "جارٍ الدخول...";
      await signInWithEmailAndPassword(auth, email, pass);
      msg.innerText = "✅ نجح الدخول!";
    } catch (e) {
      msg.innerText = "❌ خطأ: " + e.message;
    }
  };
</script>
</body>
</html>
